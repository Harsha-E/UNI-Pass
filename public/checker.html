<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNIPASS Checker</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/style.css">
<script src="../../assets/js/ui.js" defer></script>
</head>
<body>

  <main class="checker">
    <h2>Permission Verification</h2>

    <input
      id="hashInput"
      type="text"
      placeholder="Enter Permission Hash"
      autocomplete="off"
    />
    <button id="checkBtn">Verify</button>

    <section id="result"></section>
  </main>

  <script type="module">
    import {
      fetchApprovedPermissionByHash
    } from "../assets/js/permission-events.js";

    const btn = document.getElementById("checkBtn");
    const input = document.getElementById("hashInput");
    const result = document.getElementById("result");

    btn.onclick = async () => {
      const hash = input.value.trim().toUpperCase();
      if (!hash) return;

      result.innerHTML = "Checking...";

      const data = await fetchApprovedPermissionByHash(hash);
      if (!data) {
        result.innerHTML = "Invalid or unapproved permission";
        return;
      }

      const teacher = data.approvals.teacher;
      const hod = data.approvals.hod;

      result.innerHTML = `
        <p><strong>Permission ID:</strong> ${data.id}</p>
        <p><strong>Student:</strong> ${data.student.name} (${data.student.email})</p>
        <p><strong>Reason:</strong> ${data.reason.label}</p>
        ${data.reason.customText ? `<p><strong>Details:</strong> ${data.reason.customText}</p>` : ""}
        <p><strong>Approved At:</strong>
          ${hod?.approvedAt?.toDate?.() || teacher?.approvedAt?.toDate?.()}
        </p>
        <p><strong>Approved By:</strong></p>
        <ul>
          <li>Teacher: ${teacher?.name || "-"}</li>
          ${hod ? `<li>HOD: ${hod.name}</li>` : ""}
        </ul>
        ${
          data.validity?.from
            ? `<p><strong>Valid:</strong> ${data.validity.from} → ${data.validity.till}</p>`
            : ""
        }
      `;
    };
  </script>
<script type="module">
    import { db } from '../assets/js/firebase-init.js'; // Adjust path as needed

    const checkBtn = document.getElementById('verify-btn');
    const inputField = document.getElementById('permission-id-input');
    const resultDisplay = document.getElementById('verification-result');

    checkBtn.addEventListener('click', async () => {
        const permId = inputField.value.trim();
        if (!permId) return;

        resultDisplay.innerHTML = '<span class="loading">Verifying cryptographic signature...</span>';

        try {
            // 1. Fetch the document
            const docRef = await db.collection('permissions').doc(permId).get();
            
            if (!docRef.exists) {
                showResult('invalid', 'Permission ID not found in institutional registry.');
                return;
            }

            const data = docRef.data();

            // 2. Re-construct the data string (MUST match the generation logic exactly)
            // Order: studentID -> reason -> timestamp -> status
            const dataString = `${data.studentID}-${data.reason}-${data.timestamp}-${data.status}`;
            
            // 3. Re-hash it locally
            const encoder = new TextEncoder();
            const encoded = encoder.encode(dataString);
            const hashBuffer = await crypto.subtle.digest('SHA-256', encoded);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const calculatedHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            // 4. Compare with the stored signature
            if (calculatedHash === data.digitalSignature) {
                showResult('valid', data);
            } else {
                showResult('tampered', 'Hash Mismatch: Data integrity compromised.');
            }

        } catch (error) {
            console.error(error);
            showResult('error', 'System Error: Unable to verify.');
        }
    });

    function showResult(status, payload) {
        if (status === 'valid') {
            resultDisplay.className = 'status-box success';
            resultDisplay.innerHTML = `
                <h3>✅ Verified Authentic</h3>
                <p><strong>Issued To:</strong> ${payload.studentID}</p>
                <p><strong>Status:</strong> ${payload.status.toUpperCase()}</p>
                <p><strong>Date:</strong> ${new Date(payload.timestamp).toLocaleDateString()}</p>
                <small>Signature: ${payload.digitalSignature.substring(0, 16)}...</small>
            `;
        } else if (status === 'tampered') {
            resultDisplay.className = 'status-box danger';
            resultDisplay.innerHTML = `<h3>❌ TAMPER DETECTED</h3><p>${payload}</p>`;
        } else {
            resultDisplay.className = 'status-box warning';
            resultDisplay.innerHTML = `<h3>⚠️ Invalid</h3><p>${payload}</p>`;
        }
    }
</script>
</body>
</html>
