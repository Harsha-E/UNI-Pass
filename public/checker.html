<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Uni Pass • Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>

<body class="checker-page">

  <main class="checker-container">
    <section class="checker-card">

      <header class="checker-header">
        <h1>Permission Verification</h1>
        <p>Enter Permission ID to verify validity</p>
      </header>

      <div class="checker-form">
        <input
          id="pid"
          type="text"
          placeholder="Permission ID"
          autocomplete="off"
        />
        <button id="verifyBtn">Verify</button>
      </div>

      <div id="result" class="checker-result" hidden></div>

    </section>
  </main>

  <script type="module">
    import { db } from "/assets/js/firebase-init.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const btn = document.getElementById("verifyBtn");
    const pid = document.getElementById("pid");
    const res = document.getElementById("result");

    btn.onclick = async () => {
      res.hidden = true;
      const id = pid.value.trim();
      if (!id) return;

      try {
        const ref = await getDoc(doc(db, "permissions", id));
        if (!ref.exists()) {
          res.textContent = "Invalid Permission";
          res.hidden = false;
          return;
        }

        const p = ref.data();
        const now = Date.now();
        const valid =
          p.sealed &&
          new Date(p.validFrom).getTime() <= now &&
          new Date(p.validTill).getTime() >= now;

        res.textContent = valid
          ? "Permission is valid"
          : "Permission is not valid";
        res.hidden = false;

      } catch {
        res.textContent = "Unable to verify";
        res.hidden = false;
      }
    };
  </script>

</body>
</html>
