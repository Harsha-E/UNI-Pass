<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Pass | Official Campus Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 600: '#2563eb', 900: '#1e3a8a' } },
                    animation: { 'slide-up': 'slideUp 0.5s ease-out' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fas fa-shield-alt text-brand-600 text-xl"></i>
                <span class="font-bold text-lg tracking-tight text-slate-900">UNI-VERIFY</span>
            </div>
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider bg-slate-100 px-2 py-1 rounded">Security Access</div>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-6 mt-6">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <h1 class="text-xl font-bold text-center mb-1">Verify Gate Pass</h1>
            <p class="text-slate-400 text-center text-xs mb-6">Scan QR or enter Reference ID</p>

            <div class="relative">
                <input type="text" id="hashInput" class="w-full pl-12 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 outline-none font-mono text-center uppercase text-lg tracking-widest transition" placeholder="PASS ID">
                <i class="fas fa-qrcode absolute left-4 top-4 text-slate-400 text-lg"></i>
            </div>

            <button id="checkBtn" class="w-full mt-4 bg-brand-900 text-white font-bold py-3.5 rounded-xl hover:bg-brand-600 transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
                <i class="fas fa-search"></i> Validate
            </button>
        </div>

        <div id="resultContainer" class="hidden"></div>

    </main>

    <script type="module">
        import { db } from '../assets/js/firebase-init.js';
        
        const input = document.getElementById("hashInput");
        const btn = document.getElementById("checkBtn");
        const container = document.getElementById("resultContainer");

        // Auto-Check URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const passId = urlParams.get('id');
            if (passId) {
                input.value = passId;
                verifyPass(passId);
            }
        });

        btn.onclick = () => {
            const id = input.value.trim();
            if (id) verifyPass(id);
        };

        async function verifyPass(docId) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Checking Database...';
            container.innerHTML = ''; 
            container.classList.remove('hidden');

            try {
                const docRef = await db.collection('permissions').doc(docId).get();

                if (!docRef.exists) {
                    showResult("INVALID", "red", "fa-times-circle", "Pass ID not found in system.");
                    return;
                }

                const data = docRef.data();
                const now = new Date();
                const endDate = new Date(data.endDate);
                const isExpired = endDate < now;
                const isValid = data.status === 'APPROVED';

                if (isValid && !isExpired) {
                    showValidPass(docId, data);
                } else if (isExpired) {
                    showResult("EXPIRED", "orange", "fa-history", "This pass has expired.");
                } else {
                    showResult("NOT AUTHORIZED", "red", "fa-ban", `Status: ${data.status}`);
                }

            } catch (err) {
                showResult("ERROR", "slate", "fa-wifi", "Connection failed.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search"></i> Validate';
            }
        }

        function showResult(title, color, icon, msg) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl border-t-8 border-${color}-600 overflow-hidden animate-slide-up">
                    <div class="bg-${color}-50 p-8 text-center border-b border-${color}-100">
                        <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm text-${color}-600 text-4xl">
                            <i class="fas ${icon}"></i>
                        </div>
                        <h2 class="text-3xl font-black text-${color}-700 uppercase tracking-tight">${title}</h2>
                        <p class="text-${color}-600 text-sm font-bold mt-2">${msg}</p>
                    </div>
                </div>`;
        }

        function showValidPass(id, data) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl border-t-8 border-green-600 overflow-hidden animate-slide-up">
                    <div class="bg-green-50 p-6 text-center border-b border-green-100">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-3 text-green-600 text-3xl shadow-sm">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <h2 class="text-2xl font-black text-green-700 uppercase">ACCESS GRANTED</h2>
                        <p class="text-green-600 text-xs font-bold mt-1">Official Gate Pass</p>
                    </div>
                    <div class="p-6 space-y-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-xl font-bold text-slate-500">
                                ${data.studentName.charAt(0)}
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">${data.studentName}</h3>
                                <p class="text-xs text-slate-500 font-mono">${data.rollNumber}</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 grid grid-cols-2 gap-4 text-center">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400">Valid From</p>
                                <p class="font-bold text-slate-700">${new Date(data.startDate).toLocaleDateString()}</p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400">Valid To</p>
                                <p class="font-bold text-slate-700">${new Date(data.endDate).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <p class="text-center text-xs text-slate-400 font-mono mt-4">ID: ${id}</p>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
