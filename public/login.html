<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { 600: '#2563eb', 900: '#1e3a8a' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-brand-900 p-8 text-center">
            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm text-white text-2xl">
                <i class="fas fa-user-circle"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
            <p class="text-blue-200 text-sm mt-1">Sign in to access your portal</p>
        </div>

        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="email" id="email" required 
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent outline-none transition"
                            placeholder="student@college.edu">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="password" id="password" required 
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent outline-none transition"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-600">
                        <span class="text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-brand-600 font-bold hover:underline">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" 
                    class="w-full bg-brand-600 text-white font-bold py-3.5 rounded-xl hover:bg-brand-900 transition shadow-lg active:scale-95">
                    Sign In
                </button>

                <p id="error-msg" class="text-red-500 text-center text-sm font-bold hidden"></p>
            </form>
        </div>
        
        <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
            <a href="../index.html" class="text-sm text-gray-500 hover:text-brand-600 font-medium">
                <i class="fas fa-arrow-left mr-1"></i> Back to Home
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../assets/js/firebase-init.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // UI Loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Authenticating...';
            errorMsg.classList.add('hidden');

            try {
                // 1. Firebase Login
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Check User Role in Firestore
                const doc = await db.collection('users').doc(user.uid).get();
                
                if (doc.exists) {
                    const role = doc.data().role;
                    
                    // 3. Redirect based on Role
                    if (role === 'student') window.location.href = '../portals/student/portalA.html';
                    else if (role === 'teacher') window.location.href = '../portals/staff/teacher-dashboard.html'; // Assuming this exists
                    else if (role === 'hod') window.location.href = '../portals/staff/hod-dashboard.html';
                    else if (role === 'admin') window.location.href = '../admin/admin.html';
                    else {
                        throw new Error("Role not assigned. Contact Admin.");
                    }
                } else {
                    // Fallback if user exists in Auth but not in DB (rare)
                    throw new Error("User profile not found.");
                }

            } catch (error) {
                console.error(error);
                errorMsg.innerText = error.message.replace("Firebase: ", "");
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
