<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UNI-PASS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
<script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../assets/js/firebase-init.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-lg flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-3xl">
                    <i class="fas fa-university"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-500 text-sm">Sign in to access the campus permission portal.</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="you@mvgrce.edu.in">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••">
                </div>

                <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                Don't have an account? <a href="signup.html" class="text-blue-600 font-bold hover:underline">Register Here</a>
            </div>
        </div>
        
        <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
            <p class="text-xs text-gray-400">Need help? Contact the IT Department.</p>
        </div>
    </div>

<script type="module">
        import { db, auth } from '../assets/js/firebase-init.js';

        // --- 1. AUTO-CLEANUP ON LOAD ---
        // This fixes the "Stuck as Student" bug.
        // Whenever this page loads, we wipe previous session data.
        sessionStorage.clear();
        localStorage.removeItem('uni_pass_role');
        localStorage.removeItem('uni_pass_uid');
        
        // Also force Firebase to sign out just in case
        auth.signOut().catch(() => {}); 

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');

            const originalBtnText = loginBtn.innerText;
            loginBtn.innerText = "Verifying...";
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-75');

            try {
                // 2. Authenticate
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 3. Skip Verification for Test Accounts
                if (!user.emailVerified && !email.endsWith('@test.com')) {
                    await auth.signOut();
                    throw new Error("Email not verified.");
                }

                // 4. Get Role
                const doc = await db.collection('users').doc(user.uid).get();

                if (doc.exists) {
                    const data = doc.data();
                    const role = data.role;

                    // 5. SET FRESH SESSION
                    sessionStorage.setItem('uni_pass_role', role);
                    sessionStorage.setItem('uni_pass_uid', user.uid);

                    const routes = {
                        'student': '../portals/student/portalA.html',
                        'teacher': '../portals/teacher/portalA.html',
                        'hod': '../portals/hod/portalA.html',
                        'admin': '../admin/admin.html'
                    };

                    if(routes[role]) window.location.href = routes[role];
                    else throw new Error("Unknown Role: " + role);

                } else {
                    throw new Error("User profile missing in database.");
                }

            } catch (error) {
                console.error(error);
                alert("Login Failed: " + error.message);
                loginBtn.innerText = originalBtnText;
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
