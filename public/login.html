<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UNI-PASS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../assets/js/firebase-init.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans relative">

    <a href="../index.html" class="absolute top-6 left-6 text-slate-500 hover:text-blue-600 font-bold text-sm flex items-center gap-2 transition-colors z-10">
        <div class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center shadow-sm hover:shadow-md transition">
            <i class="fas fa-arrow-left"></i>
        </div>
        Back to Home
    </a>

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden m-4">
        <div class="p-8 pb-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-lg flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-3xl">
                    <i class="fas fa-university"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-500 text-sm">Sign in to access the campus permission portal.</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="2-331A----@mvgrce.edu.in">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••">
                        
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-blue-600 focus:outline-none cursor-pointer z-10">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                    <span>Sign In</span>
                    <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                Don't have an account? <a href="signup.html" class="text-blue-600 font-bold hover:underline">Register Here</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '../assets/js/firebase-init.js';

        // --- 1. SESSION CLEANUP ---
        sessionStorage.clear();
        localStorage.removeItem('uni_pass_role');
        localStorage.removeItem('uni_pass_uid');
        auth.signOut().catch(() => {}); 

        // --- 2. PASSWORD TOGGLE (Fixed Logic) ---
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                // Show Password
                input.type = 'text';
                icon.classList.remove('fa-eye-slash'); // Remove slash
                icon.classList.add('fa-eye');          // Show open eye
            } else {
                // Hide Password
                input.type = 'password';
                icon.classList.remove('fa-eye');       // Remove open eye
                icon.classList.add('fa-eye-slash');    // Show slash
            }
        });

        // --- 3. LOGIN LOGIC ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const originalBtnHTML = loginBtn.innerHTML;

            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verifying...';
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                const user = cred.user;

                if (!user.emailVerified && !email.endsWith('@test.com')) {
                    await auth.signOut();
                    throw new Error("Email not verified. Please check your inbox.");
                }

                const doc = await db.collection('users').doc(user.uid).get();

                if (doc.exists) {
                    const data = doc.data();
                    if (data.isBlocked) throw new Error("Account is blocked or pending approval.");

                    sessionStorage.setItem('uni_pass_role', data.role);
                    sessionStorage.setItem('uni_pass_uid', user.uid);

                    const routes = {
                        'student': '../portals/student/portalA.html',
                        'teacher': '../portals/teacher/portalA.html',
                        'hod': '../portals/hod/portalA.html',
                        'lab_assistant': '../portals/lab-assistant/dashboard.html',
                        'admin': '../admin/admin.html'
                    };

                    if(routes[data.role]) window.location.href = routes[data.role];
                    else throw new Error("Unknown Role: " + data.role);

                } else {
                    throw new Error("User profile missing in database.");
                }

            } catch (error) {
                console.error(error);
                alert("Login Failed: " + error.message);
                loginBtn.innerHTML = originalBtnHTML;
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                await auth.signOut();
            }
        });
    </script>
</body>
</html>
