<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UNI-PASS</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .bg-brand-900 { background-color: #1e3a8a !important; }
        .bg-brand-600 { background-color: #2563eb !important; }
        .text-brand-600 { color: #2563eb !important; }
        .border-brand-600 { border-color: #2563eb !important; }
        .hover\:bg-brand-700:hover { background-color: #1d4ed8 !important; }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .premium-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #172554 100%);
        }
    </style>
</head>
<body class="premium-bg min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full glass rounded-2xl shadow-2xl overflow-hidden transform transition-all hover:scale-[1.01]">
        
        <div class="p-8 text-center border-b border-gray-100">
            <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-brand-600 text-3xl shadow-inner">
                <i class="fas fa-university"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 tracking-tight">Welcome Back</h2>
            <p class="text-gray-500 text-sm mt-2">Enter your credentials to access the portal.</p>
        </div>

        <div class="p-8 pt-6">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400 group-focus-within:text-brand-600 transition">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required 
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-600 focus:border-transparent outline-none transition-all text-gray-800 font-medium placeholder-gray-400"
                            placeholder="student@college.edu">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400 group-focus-within:text-brand-600 transition">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" required 
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-600 focus:border-transparent outline-none transition-all text-gray-800 font-medium placeholder-gray-400"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-600 border-gray-300">
                        <span class="text-gray-600 font-medium">Remember me</span>
                    </label>
                    <a href="#" class="text-brand-600 font-bold hover:underline">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" 
                    class="w-full bg-brand-600 text-white font-bold py-4 rounded-xl hover:bg-brand-700 transition-all shadow-lg shadow-blue-500/30 transform active:scale-95 flex items-center justify-center gap-2">
                    <span>Sign In to Dashboard</span>
                    <i class="fas fa-arrow-right text-sm"></i>
                </button>

                <div id="error-msg" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-bold border border-red-100 flex items-center justify-center gap-2">
                    <i class="fas fa-exclamation-circle"></i> <span>Error text</span>
                </div>
            </form>
        </div>
        
        <div class="bg-gray-50 p-5 text-center border-t border-gray-100">
            <p class="text-sm text-gray-600">
                Don't have an account? 
                <a href="signup.html" class="text-brand-600 font-bold hover:underline ml-1">Sign Up</a>
            </p>
            <div class="mt-4 pt-4 border-t border-gray-200">
                <a href="../index.html" class="text-xs text-gray-400 hover:text-gray-600 transition flex items-center justify-center gap-1">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../assets/js/firebase-init.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-msg');
        const errorText = errorMsg.querySelector('span');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Authenticating...';
            errorMsg.classList.add('hidden');

            try {
                // 1. Firebase Login
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // ----------------------------------------------------
                // NEW: CHECK EMAIL VERIFICATION
                // ----------------------------------------------------
                if (!user.emailVerified) {
                    // Force logout immediately
                    await auth.signOut();
                    throw new Error("Email not verified. Please check your inbox and verify your email before logging in.");
                }
                // ----------------------------------------------------

                // 2. Fetch Role
                const doc = await db.collection('users').doc(user.uid).get();
                
                if (doc.exists) {
                    const role = doc.data().role;
                    const routes = {
                        'student': '../portals/student/portalA.html',
                        'teacher': '../portals/staff/teacher-dashboard.html',
                        'hod': '../portals/staff/hod-dashboard.html',
                        'admin': '../admin/admin.html'
                    };

                    if (routes[role]) {
                        window.location.href = routes[role];
                    } else {
                        throw new Error("Role not configured properly.");
                    }
                } else {
                    throw new Error("User profile not found in database.");
                }

            } catch (error) {
                console.error(error);
                let message = error.message;

                // Friendly Firebase Error Messages
                if (error.code === 'auth/invalid-credential') message = "Incorrect email or password.";
                if (error.code === 'auth/network-request-failed') message = "Network Error. Check internet connection.";
                if (error.code === 'auth/user-not-found') message = "No account found with this email.";
                if (message.includes("Firebase:")) message = message.replace("Firebase: ", "");
                
                errorText.innerText = message;
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Sign In to Dashboard</span> <i class="fas fa-arrow-right text-sm"></i>';
            }
        });
    </script>
</body>
</html>
