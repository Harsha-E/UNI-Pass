<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | UNI-PASS System</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Deep Blue Brand Colors */
        .bg-brand-900 { background-color: #1e3a8a !important; }
        .bg-brand-600 { background-color: #2563eb !important; }
        .text-brand-600 { color: #2563eb !important; }
        .focus\:ring-brand-600:focus { --tw-ring-opacity: 1; --tw-ring-color: rgba(37, 99, 235, 0.5); }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Background Gradient */
        .premium-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #172554 100%);
        }
        
        /* Custom Radio Button Style */
        input[type="radio"]:checked + div {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="premium-bg min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full glass rounded-2xl shadow-2xl overflow-hidden transform transition-all hover:scale-[1.01]">
        
        <div class="p-8 pb-4 text-center border-b border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Create Account</h2>
            <p class="text-gray-500 text-sm mt-1">Institutional Access Portal</p>
        </div>

        <form id="signup-form" class="p-8 pt-6 space-y-5">
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Full Name</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="reg-name" required 
                        class="w-full pl-10 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-600 outline-none transition" 
                        placeholder="e.g. Arjun Reddy">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">College Email</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="reg-email" required 
                        class="w-full pl-10 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-600 outline-none transition" 
                        placeholder="id@mvgrce.edu.in">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Password</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="reg-pass" required 
                        class="w-full pl-10 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-600 outline-none transition" 
                        placeholder="••••••••">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">I am a...</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="student" checked class="peer sr-only" onchange="window.toggleRollField(true)">
                        <div class="text-center py-2 border border-gray-200 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">Student</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="teacher" class="peer sr-only" onchange="window.toggleRollField(false)">
                        <div class="text-center py-2 border border-gray-200 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">Faculty</div>
                    </label>
                </div>
            </div>

            <div id="roll-container" class="animate-fade-in">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Roll Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-id-card"></i>
                    </span>
                    <input type="text" id="reg-roll" 
                        class="w-full pl-10 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-600 outline-none transition font-mono uppercase" 
                        placeholder="e.g. 24331A4201">
                </div>
                <p class="text-[10px] text-gray-400 mt-1 ml-1">Section and Department will be auto-assigned.</p>
            </div>

            <button type="submit" id="btn-signup" 
                class="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-500/30 transform active:scale-95 mt-4">
                Register Account
            </button>

            <p id="status-msg" class="text-center text-xs text-brand-600 font-bold hidden"></p>

            <div class="text-center pt-2 border-t border-gray-100">
                <p class="text-sm text-gray-500">
                    Already have an account? <a href="login.html" class="text-brand-600 font-bold hover:underline">Login</a>
                </p>
            </div>
        </form>
    </div>

    <script type="module">
        import { db, auth } from '../assets/js/firebase-init.js';
        import { createUserWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Helper: Toggle Roll Number Input
        window.toggleRollField = (isStudent) => {
            const el = document.getElementById('roll-container');
            const input = document.getElementById('reg-roll');
            if(isStudent) {
                el.classList.remove('hidden');
                input.required = true;
            } else {
                el.classList.add('hidden');
                input.required = false;
            }
        };

        const form = document.getElementById('signup-form');
        const statusMsg = document.getElementById('status-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-signup');
            
            // 1. UI Loading
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            statusMsg.classList.remove('hidden');
            statusMsg.className = "text-center text-xs text-blue-600 font-bold animate-pulse";
            statusMsg.innerText = "Connecting to Firebase...";

            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const roll = document.getElementById('reg-roll').value.trim();

            try {
                // 2. Create User
                statusMsg.innerText = "Creating User Account...";
                console.log("Attempting to create user...");
                
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                console.log("User Created:", user.uid);

                // 3. Send Verification Email
                statusMsg.innerText = "Sending Verification Email...";
                console.log("Attempting to send email...");
                
                await sendEmailVerification(user)
                    .then(() => console.log("Email Sent Successfully"))
                    .catch((err) => {
                        console.error("Email Error:", err);
                        throw new Error("Could not send email: " + err.message);
                    });

                // 4. Auto-Assign Logic
                let section = 'N/A';
                let department = 'General';
                
                if (role === 'student' && roll) {
                    if (roll.includes('42')) department = 'CSE';
                    else if (roll.includes('01')) department = 'Civil';
                    else if (roll.includes('03')) department = 'Mech';
                    else if (roll.includes('04')) department = 'ECE';
                    else if (roll.includes('05')) department = 'IT';
                    
                    const lastTwo = parseInt(roll.slice(-2));
                    if (!isNaN(lastTwo)) section = (lastTwo <= 66) ? 'A' : 'B';
                }

                // 5. Save to Firestore
                statusMsg.innerText = "Saving Profile Data...";
                await db.collection('users').doc(user.uid).set({
                    displayName: name,
                    email: email,
                    role: role,
                    rollNumber: role === 'student' ? roll.toUpperCase() : null,
                    department: department,
                    section: section,
                    attendance: 75,
                    isBlocked: false,
                    createdAt: new Date().toISOString()
                });

                // 6. Success
                alert(`SUCCESS!\n\nUser created for: ${email}\n\nWe have sent a verification email. Please check your SPAM folder if not found.`);
                await signOut(auth);
                window.location.href = 'login.html';

            } catch (err) {
                console.error("FULL ERROR:", err);
                statusMsg.className = "text-center text-xs text-red-500 font-bold";
                statusMsg.innerText = err.message.replace("Firebase: ", "");
                btn.disabled = false;
                btn.innerText = "Try Again";
                alert("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
