<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-gray-50 font-sans p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
            <div>
                <h1 class="text-xl font-bold text-gray-900">Faculty Approval Archive</h1>
                <p class="text-sm text-gray-500">Historical record of all actions taken.</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="portalA.html" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-700 hover:bg-gray-50 transition">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
                </a>
                <button id="logout-btn" class="px-4 py-2 bg-red-50 border border-red-200 rounded-lg text-sm font-bold text-red-600 hover:bg-red-100 transition">
                    <i class="fas fa-power-off mr-2"></i> Logout
                </button>
            </div>
        </div>

        <div class="p-4 border-b border-gray-100">
            <input type="text" id="search" placeholder="Search student name..." class="w-full md:w-1/3 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" onkeyup="filterTable()">
        </div>

        <table class="w-full text-left">
            <thead class="bg-gray-100 text-xs font-bold text-gray-500 uppercase">
                <tr>
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3">Student</th>
                    <th class="px-6 py-3">Type</th>
                    <th class="px-6 py-3">Action Taken</th>
                    <th class="px-6 py-3">Final Status</th>
                </tr>
            </thead>
            <tbody id="archive-list" class="text-sm divide-y divide-gray-100">
                <tr><td colspan="5" class="p-8 text-center text-gray-400">Loading records...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        let allRecords = [];

        auth.onAuthStateChanged(user => {
            if(user) loadArchive(user.uid);
        });

        async function loadArchive(uid) {
            // Find permissions where THIS teacher took action
            // Note: This requires a complex index or client-side filtering. 
            // For hackathon, we fetch all processed permissions and filter by approvals.teacher.uid
            
            const snap = await db.collection('permissions')
                .where('status', 'in', ['APPROVED', 'REJECTED', 'PENDING_HOD'])
                .orderBy('timestamp', 'desc')
                .get();

            const tbody = document.getElementById('archive-list');
            tbody.innerHTML = '';
            allRecords = [];

            snap.forEach(doc => {
                const data = doc.data();
                // Check if this teacher touched it
                if (data.approvals?.teacher?.uid === uid) {
                    allRecords.push(data);
                    tbody.appendChild(createRow(data));
                }
            });

            if(allRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">No history found.</td></tr>';
            }
        }

        function createRow(data) {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition";
            
            const action = data.approvals.teacher.action;
            let actionBadge = action.includes('APPROVED') 
                ? '<span class="text-green-600 font-bold">Approved</span>' 
                : '<span class="text-red-600 font-bold">Rejected</span>';
            
            if(action.includes('ESCALATED')) actionBadge = '<span class="text-orange-600 font-bold">Escalated</span>';

            tr.innerHTML = `
                <td class="px-6 py-4 text-gray-500 font-mono text-xs">${new Date(data.timestamp).toLocaleDateString()}</td>
                <td class="px-6 py-4 font-bold text-gray-800">${data.studentName}</td>
                <td class="px-6 py-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-bold">${data.reasonType}</span></td>
                <td class="px-6 py-4">${actionBadge}</td>
                <td class="px-6 py-4 text-xs font-mono uppercase">${data.status}</td>
            `;
            return tr;
        }

        document.getElementById('logout-btn').onclick = () => {
            auth.signOut().then(() => location.href = '../../public/login.html');
        };

        window.filterTable = () => {
            const term = document.getElementById('search').value.toLowerCase();
            const tbody = document.getElementById('archive-list');
            tbody.innerHTML = '';
            
            const filtered = allRecords.filter(r => r.studentName.toLowerCase().includes(term));
            filtered.forEach(data => tbody.appendChild(createRow(data)));
        };
    </script>
</body>
</html>
