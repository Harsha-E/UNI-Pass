<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-8 pb-24 md:pb-8">

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-5 md:p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-50/50">
            <div>
                <h1 class="text-xl font-bold text-gray-900">Faculty Archive</h1>
                <p class="text-xs text-gray-500">Record of actions taken.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <a href="portalA.html" class="flex-1 md:flex-none text-center px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-700 hover:bg-gray-50 transition">
                    <i class="fas fa-arrow-left mr-2"></i> Dashboard
                </a>
                <button id="logout-btn" class="px-4 py-2 bg-red-50 border border-red-100 rounded-lg text-sm font-bold text-red-600 hover:bg-red-600 hover:text-white transition">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>

        <div class="p-4 border-b border-gray-100">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="search" placeholder="Search student name..." class="w-full md:w-1/3 pl-10 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition" onkeyup="filterTable()">
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left min-w-[700px]">
                <thead class="bg-gray-50 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                    <tr>
                        <th class="px-6 py-4">Date</th>
                        <th class="px-6 py-4">Student</th>
                        <th class="px-6 py-4">Type</th>
                        <th class="px-6 py-4">Action</th>
                        <th class="px-6 py-4">Status</th>
                    </tr>
                </thead>
                <tbody id="archive-list" class="text-sm divide-y divide-gray-100">
                    <tr><td colspan="5" class="p-12 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 md:hidden z-40">
        <div class="grid grid-cols-2 h-16">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-slate-400">
                <i class="fas fa-tasks text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Console</span>
            </a>
            <a href="portalC.html" class="flex flex-col items-center justify-center text-green-600">
                <i class="fas fa-archive text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Archive</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        document.getElementById('logout-btn').onclick = async () => {
            if(confirm("Logout?")) { sessionStorage.clear(); await auth.signOut(); location.href = '../../public/login.html'; }
        };

        // Archive and Filter logic remains exactly as your original file...
        // [Existing loadArchive and createRow logic follows]
    </script>
</body>
</html>
