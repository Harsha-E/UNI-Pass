<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Portal • UNIPASS</title>
  <link rel="stylesheet" href="https://harsha-e.github.io/UNI-Pass/assets/css/main.css" />
  <script type="module" src="https://harsha-e.github.io/UNI-Pass/assets/js/route-guard.js"></script>
  <link rel="stylesheet" href="https://harsha-e.github.io/UNI-Pass/assets/css/style.css">
<script src="https://harsha-e.github.io/UNI-Pass/assets/js/ui.js" defer></script>
</head>
<body>

  <main class="teacher-portal">
    <h2>Pending Student Permissions</h2>
    <ul id="pendingList"></ul>

    <h2>Approved / Rejected</h2>
    <ul id="historyList"></ul>
  </main>

  <script type="module">
    import { auth } from "https://harsha-e.github.io/UNI-Pass/assets/js/firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    import {
      fetchTeacherPermissions
    } from "https://harsha-e.github.io/UNI-Pass/assets/js/permission-events.js";

    import {
      approveAsTeacher,
      rejectAsTeacher
    } from "https://harsha-e.github.io/UNI-Pass/assets/js/permission-flow.js";

    const pendingList = document.getElementById("pendingList");
    const historyList = document.getElementById("historyList");

    function renderPermission(p, actions = false) {
      const li = document.createElement("li");

      li.innerHTML = `
        <strong>${p.student.name}</strong> — ${p.reason.label}
        ${p.reason.customText ? `<div>${p.reason.customText}</div>` : ""}
        <div>Status: ${p.status.final}</div>
      `;

      if (actions) {
        const approve = document.createElement("button");
        approve.textContent = "Approve";
        approve.onclick = async () => {
          const user = auth.currentUser;
          if (!user) return;
          await approveAsTeacher(p.id, {
            uid: user.uid,
            name: user.email,
            email: user.email
          });
          load();
        };

        const reject = document.createElement("button");
        reject.textContent = "Reject";
        reject.onclick = async () => {
          const user = auth.currentUser;
          if (!user) return;
          await rejectAsTeacher(p.id, {
            uid: user.uid,
            name: user.email,
            email: user.email
          });
          load();
        };

        li.appendChild(approve);
        li.appendChild(reject);
      }

      return li;
    }

    async function load() {
      const list = await fetchTeacherPermissions();
      pendingList.innerHTML = "";
      historyList.innerHTML = "";

      list.forEach(p => {
        if (p.status.teacher === "pending") {
          pendingList.appendChild(renderPermission(p, true));
        } else {
          historyList.appendChild(renderPermission(p));
        }
      });
    }

    onAuthStateChanged(auth, user => {
      if (!user) return;
      load();
    });
  </script>

</body>
</html>
