<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | UNI-PASS Teacher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/table-view.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-slate-100 font-sans h-screen flex overflow-hidden">
    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white z-50 flex flex-col shadow-xl">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center gap-2">
                <i class="fas fa-chalkboard-teacher text-blue-500"></i>
                <span class="font-bold text-lg tracking-wider">TEACHER</span>
            </div>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="portalA.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-bold transition-all">
                <i class="fas fa-inbox w-4"></i> Inbox
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition-all">
                <i class="fas fa-history w-4"></i> History
            </a>
            <a href="myclass.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-bold transition-all">
                <i class="fas fa-users w-4"></i> My Class
            </a>
            <a href="substitutes.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-bold transition-all">
                <i class="fas fa-user-friends w-4"></i> Substitutes
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full py-2 flex items-center justify-center gap-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition text-sm font-bold">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full ml-64 overflow-y-auto p-8 bg-slate-100">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Action History</h1>
            <p class="text-slate-500 text-sm">Review all previously processed permission requests.</p>
        </header>

        <div class="mb-6">
            <div class="relative w-full md:w-96">
                <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="history-search" placeholder="Search by name, roll no, or type..." class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
        </div>

        <div class="table-viewport">
            <table class="w-full text-sm text-left text-slate-500">
                <thead class="text-xs text-slate-700 uppercase">
                    <tr>
                        <th scope="col" class="px-6 py-4">Student</th>
                        <th scope="col" class="px-6 py-4">Dates</th>
                        <th scope="col" class="px-6 py-4">Type</th>
                        <th scope="col" class="px-6 py-4">Final Status</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="4" class="p-8 text-center text-slate-400">Loading history...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        let allHistory = [];

        auth.onAuthStateChanged(user => {
            if (user) loadHistory(user.uid);
            else window.location.href = '../../public/login.html';
        });

        async function loadHistory(uid) {
            const tbody = document.getElementById('history-table-body');
            try {
                const snap = await db.collection('permissions')
                    .where('classTeacherUid', '==', uid)
                    .limit(40) 
                    .get();

                allHistory = snap.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(p => ['APPROVED', 'REJECTED'].includes(p.status))
                    .sort((a, b) => new Date(b.logs[b.logs.length - 1].at) - new Date(a.logs[a.logs.length - 1].at));

                renderHistory();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-500">Error loading history.</td></tr>';
            }
        }

        function renderHistory() {
            const tbody = document.getElementById('history-table-body');
            const searchTerm = document.getElementById('history-search').value.toLowerCase();
            
            const filtered = allHistory.filter(req => 
                req.student.name.toLowerCase().includes(searchTerm) ||
                req.student.rollNumber.toLowerCase().includes(searchTerm) ||
                req.type.toLowerCase().includes(searchTerm) ||
                req.status.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-400">No matching requests found.</td></tr>';
                    return;
                }

            tbody.innerHTML = filtered.map(req => `
                    <tr class="bg-white border-b hover:bg-slate-50 transition">
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800">${req.student.name}</div>
                            <div class="text-xs text-slate-500">${req.student.rollNumber}</div>
                        </td>
                        <td class="px-6 py-4 text-slate-700">${req.startDate} to ${req.endDate}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-[10px] font-bold uppercase rounded bg-slate-100 text-slate-600">${req.type}</span></td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-bold rounded ${req.status === 'APPROVED' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${req.status}</span>
                        </td>
                    </tr>
                `).join('');
        }

        document.getElementById('history-search').addEventListener('input', renderHistory);
        document.getElementById('logout-btn').onclick = () => auth.signOut().then(() => location.href = '../../public/login.html');
    </script>
</body>
</html>
