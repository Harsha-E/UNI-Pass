<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/table-view.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-slate-100 font-sans h-screen flex overflow-hidden">

    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white z-50 flex flex-col shadow-xl">
        <!-- Sidebar content (similar to student portal) -->
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center gap-2">
                <i class="fas fa-chalkboard-teacher text-blue-500"></i>
                <span class="font-bold text-lg tracking-wider">TEACHER</span>
            </div>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="portalA.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition-all">
                <i class="fas fa-inbox w-4"></i> Inbox
            </a>
            <a href="history.html" id="nav-history" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-bold transition-all">
                <i class="fas fa-history w-4"></i> History
            </a>
            <a href="myclass.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-bold transition-all">
                <i class="fas fa-users w-4"></i> My Class
            </a>
            <a href="substitutes.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-bold transition-all">
                <i class="fas fa-user-friends w-4"></i> Substitutes
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full py-2 flex items-center justify-center gap-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition text-sm font-bold">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full ml-64 overflow-y-auto p-8 bg-slate-100">
        <div id="view-inbox">
            <header class="mb-8">
                <h1 class="text-2xl font-bold text-slate-800">Pending Requests</h1>
                <p class="text-slate-500 text-sm">Manage pending requests with sorting and bulk actions.</p>
            </header>
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm mb-4 p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <button id="bulk-approve-btn" disabled class="px-4 py-2 bg-slate-100 text-slate-400 font-bold text-xs rounded-lg cursor-not-allowed flex items-center gap-2 transition-all">
                        <i class="fas fa-check-double"></i> Approve
                    </button>
                    <button id="bulk-reject-btn" disabled class="px-4 py-2 bg-slate-100 text-slate-400 font-bold text-xs rounded-lg cursor-not-allowed flex items-center gap-2 transition-all">
                        <i class="fas fa-times-circle"></i> Reject
                    </button>
                    <span id="selection-count" class="text-xs font-bold text-slate-400"></span>
                </div>
                <div class="relative w-full md:w-64">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="inbox-search" placeholder="Search inbox..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
            </div>
            <div class="table-viewport">
                <table class="w-full text-sm text-left text-slate-500">
                    <thead class="text-xs text-slate-700 uppercase">
                        <tr>
                            <th class="px-4 py-4 w-10"><input type="checkbox" id="select-all-checkbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500"></th>
                            <th scope="col" class="px-6 py-4 sortable cursor-pointer hover:bg-slate-100 transition" data-sort="student.name">Student <i class="fas fa-sort ml-1 text-slate-300"></i></th>
                            <th scope="col" class="px-6 py-4 sortable cursor-pointer hover:bg-slate-100 transition" data-sort="startDate">Dates <i class="fas fa-sort ml-1 text-slate-300"></i></th>
                            <th scope="col" class="px-6 py-4">Reason</th>
                            <th scope="col" class="px-6 py-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inbox-table-body"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Quick View Modal -->
    <div id="quick-view-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeQuickView()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-slate-900 p-6 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">Request Details</h3>
                <button onclick="closeQuickView()" class="text-slate-400 hover:text-white transition"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Student</p><p id="qv-name" class="font-bold text-slate-800"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Roll Number</p><p id="qv-roll" class="font-mono text-slate-600"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Type</p><p id="qv-type" class="font-bold text-blue-600"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Duration</p><p id="qv-duration" class="font-bold text-slate-800"></p></div>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Reason</p>
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 text-sm text-slate-700 italic" id="qv-reason"></div>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-3">Workflow History</p>
                    <div id="qv-logs" class="space-y-3 border-l-2 border-slate-100 ml-2 pl-4">
                        <!-- Logs injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        import { PermissionService } from '../../assets/js/permission-flow.js';

        let teacherProfile = null;
        let inboxData = [];
        let sortState = { key: null, dir: 'asc' };

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (!doc.exists) return;
                    teacherProfile = { uid: doc.id, ...doc.data() };

                    loadAllData();
                });
            } else {
                window.location.href = '../../public/login.html';
            }
        });

        function loadAllData() {
            db.collection('permissions')
              .where('currentHandlerUid', '==', teacherProfile.uid)
              .onSnapshot(snap => {
                  inboxData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                  renderInboxTable();
              });
        }

        function renderInboxTable() {
            const tbody = document.getElementById('inbox-table-body');
            const searchTerm = document.getElementById('inbox-search').value.toLowerCase();
            tbody.innerHTML = '';
            
            document.querySelectorAll('.sortable i').forEach(icon => {
                icon.className = 'fas fa-sort ml-1 text-slate-300';
            });
            if (sortState.key) {
                const activeIcon = document.querySelector(`.sortable[data-sort="${sortState.key}"] i`);
                if (activeIcon) activeIcon.className = `fas fa-sort-${sortState.dir === 'asc' ? 'up' : 'down'} ml-1 text-blue-600`;
            }

            if (inboxData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-slate-400 p-8">Your inbox is empty.</td></tr>`;
                return;
            }

            const filteredData = inboxData.filter(req => 
                req.student.name.toLowerCase().includes(searchTerm) || 
                req.student.rollNumber.toLowerCase().includes(searchTerm) ||
                req.reason.toLowerCase().includes(searchTerm)
            );

            if (sortState.key) {
                filteredData.sort((a, b) => {
                    let valA = a[sortState.key];
                    let valB = b[sortState.key];
                    if (sortState.key.includes('.')) {
                        valA = sortState.key.split('.').reduce((o, i) => o[i], a);
                        valB = sortState.key.split('.').reduce((o, i) => o[i], b);
                    }
                    if (valA < valB) return sortState.dir === 'asc' ? -1 : 1;
                    if (valA > valB) return sortState.dir === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-slate-400 p-8">No matching requests found.</td></tr>`;
                return;
            }

            filteredData.forEach(request => {
                const duration = Math.ceil((new Date(request.endDate) - new Date(request.startDate)) / 86400000) + 1;
                const row = document.createElement('tr');
                row.className = 'bg-white border-b hover:bg-slate-50';
                row.innerHTML = `
                    <td class="px-4 py-4"><input type="checkbox" class="row-checkbox w-4 h-4 text-blue-600 rounded" data-id="${request.id}"></td>
                    <td class="px-6 py-4"><div class="font-bold text-slate-800">${request.student.name}</div><div class="text-xs text-slate-500">${request.student.rollNumber}</div></td>
                    <td class="px-6 py-4"><div class="font-bold text-slate-800">${request.startDate} to ${request.endDate}</div><div class="text-xs text-slate-500">${duration} Day(s)</div></td>
                    <td class="px-6 py-4"><p class="max-w-xs truncate" title="${request.reason}">${request.reason}</p></td>
                    <td class="px-6 py-4 text-center space-x-2 action-cell">
                        <button onclick="openQuickView('${request.id}')" class="px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 rounded-md hover:bg-slate-200"><i class="fas fa-eye"></i></button>
                        <button onclick="handleAction('${request.id}', 'APPROVE')" class="action-btn px-3 py-1 text-xs font-bold text-white bg-blue-600 rounded-md hover:bg-blue-700">Approve</button>
                        <button onclick="handleAction('${request.id}', 'REJECT')" class="action-btn px-3 py-1 text-xs font-bold text-white bg-red-600 rounded-md hover:bg-red-700">Reject</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            addSelectionListeners();
        }

        window.openQuickView = (id) => {
            const req = inboxData.find(r => r.id === id);
            if (!req) return;

            document.getElementById('qv-name').innerText = req.student.name;
            document.getElementById('qv-roll').innerText = req.student.rollNumber;
            document.getElementById('qv-type').innerText = req.type;
            document.getElementById('qv-reason').innerText = req.reason;
            
            const duration = Math.ceil((new Date(req.endDate) - new Date(req.startDate)) / 86400000) + 1;
            document.getElementById('qv-duration').innerText = `${duration} Day(s) (${req.startDate} to ${req.endDate})`;

            const logsContainer = document.getElementById('qv-logs');
            logsContainer.innerHTML = req.logs.map(log => `
                <div class="relative">
                    <div class="absolute -left-[21px] top-1.5 w-3 h-3 rounded-full bg-white border-2 border-blue-500"></div>
                    <p class="text-xs font-bold text-slate-800">${log.action}</p>
                    <p class="text-[10px] text-slate-500">${log.by} • ${new Date(log.at).toLocaleString()}</p>
                    ${log.reason ? `<p class="text-[10px] text-red-500 mt-1 italic">"${log.reason}"</p>` : ''}
                </div>
            `).join('');

            document.getElementById('quick-view-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeQuickView = () => {
            document.getElementById('quick-view-modal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        window.handleAction = async (docId, action) => {
            const button = event.target;
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                let details = {};
                if (action === 'REJECT') {
                    details.reason = prompt("Please provide a reason for rejection:");
                    if (!details.reason) { button.disabled = false; button.innerHTML = 'Reject'; return; }
                }
                await PermissionService.processRequestAction(docId, action, details);
                // The onSnapshot listener will automatically remove the row from the UI.
            } catch (err) {
                alert("Error: " + err.message);
                button.disabled = false;
                button.innerHTML = action === 'APPROVE' ? 'Approve' : 'Reject';
            }
        };

        document.querySelectorAll('.sortable').forEach(header => {
            header.addEventListener('click', () => {
                const key = header.dataset.sort;
                if (sortState.key === key) {
                    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortState.key = key;
                    sortState.dir = 'asc';
                }
                renderInboxTable();
            });
        });

        function addSelectionListeners() {
            document.getElementById('select-all-checkbox').addEventListener('change', (e) => {
                document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = e.target.checked);
                updateBulkButtonState();
            });
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.addEventListener('change', updateBulkButtonState));
        }

        function updateBulkButtonState() {
            const selected = document.querySelectorAll('.row-checkbox:checked');
            const approveBtn = document.getElementById('bulk-approve-btn');
            const rejectBtn = document.getElementById('bulk-reject-btn');
            document.getElementById('selection-count').textContent = selected.length > 0 ? `${selected.length} selected` : '';
            if (selected.length > 0) {
                approveBtn.disabled = false;
                approveBtn.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-lg hover:bg-blue-700 flex items-center gap-2 shadow-lg shadow-blue-200 transition-all";
                rejectBtn.disabled = false;
                rejectBtn.className = "px-4 py-2 bg-red-600 text-white font-bold text-xs rounded-lg hover:bg-red-700 flex items-center gap-2 shadow-lg shadow-red-200 transition-all";
            } else {
                approveBtn.disabled = true;
                approveBtn.className = "px-4 py-2 bg-slate-100 text-slate-400 font-bold text-xs rounded-lg cursor-not-allowed flex items-center gap-2 transition-all";
                rejectBtn.disabled = true;
                rejectBtn.className = "px-4 py-2 bg-slate-100 text-slate-400 font-bold text-xs rounded-lg cursor-not-allowed flex items-center gap-2 transition-all";
            }
        }

        document.getElementById('bulk-approve-btn').addEventListener('click', async () => {
            const selected = document.querySelectorAll('.row-checkbox:checked');
            if (selected.length === 0 || !confirm(`Approve ${selected.length} requests at once?`)) return;

            const btn = document.getElementById('bulk-approve-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const promises = Array.from(selected).map(cb => PermissionService.processRequestAction(cb.dataset.id, 'APPROVE'));
            
            try {
                await Promise.all(promises);
                alert(`${promises.length} requests approved successfully.`);
            } catch (err) {
                alert(`An error occurred during bulk approval: ${err.message}`);
            } finally {
                btn.innerHTML = '<i class="fas fa-check-double"></i> Approve Selected';
                document.getElementById('select-all-checkbox').checked = false;
                updateBulkButtonState();
            }
        });

        document.getElementById('bulk-reject-btn').addEventListener('click', async () => {
            const selected = document.querySelectorAll('.row-checkbox:checked');
            if (selected.length === 0) return;
            
            const reason = prompt(`Reject ${selected.length} requests? Enter reason for all:`);
            if (!reason) return;

            const btn = document.getElementById('bulk-reject-btn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const promises = Array.from(selected).map(cb => PermissionService.processRequestAction(cb.dataset.id, 'REJECT', { reason }));
                await Promise.all(promises);
                alert(`${promises.length} requests rejected.`);
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.innerHTML = originalHTML;
                document.getElementById('select-all-checkbox').checked = false;
                updateBulkButtonState();
            }
        });

        document.getElementById('inbox-search').addEventListener('input', renderInboxTable);

        document.getElementById('logout-btn').onclick = () => auth.signOut().then(() => location.href = '../../public/login.html');

    </script>
</body>
</html>
