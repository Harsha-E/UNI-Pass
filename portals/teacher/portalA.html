<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Console | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#16a34a', 900: '#14532d' } },
                    boxShadow: { 'glow': '0 0 20px rgba(22, 163, 74, 0.15)' }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .tab-active { background-color: #16a34a; color: white; border-color: #16a34a; }
        .tab-inactive { background-color: white; color: #64748b; border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col pb-20 md:pb-0">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <button id="logout-btn-mobile" class="md:hidden text-slate-400 hover:text-red-500 transition-colors p-2">
                        <i class="fas fa-power-off text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-bold text-xl text-slate-800 tracking-tight">Faculty</h1>
                        <p class="text-[10px] font-bold text-brand-600 uppercase tracking-wider" id="teacher-dept">...</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-full text-xs font-bold text-slate-500">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span id="badge-incoming">0 Pending</span>
                    </div>
                    <button id="logout-btn" class="hidden md:flex items-center gap-2 text-slate-500 hover:text-red-600 font-bold text-xs uppercase tracking-widest transition-colors">
                        <span>Logout</span>
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 space-y-6">
        <div class="flex p-1 bg-slate-200 rounded-xl">
            <button onclick="switchTab('incoming')" id="tab-incoming" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all tab-active flex items-center justify-center gap-2">
                <i class="fas fa-inbox"></i> Inbox
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all tab-inactive flex items-center justify-center gap-2">
                <i class="fas fa-history"></i> History
            </button>
        </div>

        <div id="request-feed" class="space-y-4 min-h-[400px]">
            <div class="text-center py-12 text-slate-400"><i class="fas fa-circle-notch fa-spin text-3xl"></i></div>
        </div>

        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300 text-3xl"><i class="fas fa-check-double"></i></div>
            <h3 class="text-slate-900 font-bold">All caught up!</h3>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 md:hidden z-40">
        <div class="grid grid-cols-2 h-16">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-brand-600">
                <i class="fas fa-tasks text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Console</span>
            </a>
            <a href="portalC.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600">
                <i class="fas fa-archive text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Archive</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        const logout = async () => { if(confirm("Sign out of Faculty Console?")) { sessionStorage.clear(); await auth.signOut(); location.href = '../../public/login.html'; }};
        document.getElementById('logout-btn').onclick = logout;
        document.getElementById('logout-btn-mobile').onclick = logout;

        let currentUser = null;
        let myDept = null;

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                const profile = await db.collection('users').doc(user.uid).get();
                if (profile.exists) {
                    myDept = profile.data().department;
                    document.getElementById('teacher-dept').innerText = `${myDept} Dept`;
                    loadRequests();
                }
            } else location.href = '../../public/login.html';
        });

        // Tab and Request logic remains exactly as your original file...
        // [Existing onSnapshot and createCard logic follows]
    </script>
</body>
</html>
