<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script type="module">
    import { db, auth } from '../../assets/js/firebase-init.js';
    import { sendEmail } from '../../assets/js/services.js'; // <--- IMPORT THIS

    // ... (Existing code) ...

    // Find your 'approveRequest' or similar function and update it:
    window.approveRequest = async (docId, studentEmail, studentName, reason) => {
        try {
            const ref = db.collection('permissions').doc(docId);
            
            await ref.update({
                status: 'APPROVED',
                'approvals.teacher': {
                    uid: auth.currentUser.uid,
                    name: auth.currentUser.displayName,
                    timestamp: new Date().toISOString()
                }
            });

            // --- SEND EMAIL NOTIFICATION ---
            await sendEmail(studentEmail, studentName, "APPROVED", reason);
            
            alert("Request Approved & Email Sent!");
        
        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
        }
    };
</script>
