<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#2563eb', 900: '#1e3a8a' } } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans h-screen flex overflow-hidden">

    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden glass"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 z-50 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col shadow-xl md:shadow-none">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <span class="font-bold text-xl text-gray-800 tracking-tight">UNI-PASS</span>
                <span class="text-[10px] bg-brand-600 text-white px-2 py-0.5 rounded uppercase font-bold">Faculty</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="p-6">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-brand-600 to-brand-900 text-white flex items-center justify-center font-bold text-xl shadow-md">
                    <span id="avatar-initial">T</span>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-gray-900 truncate w-32" id="teacher-name">Loading...</h4>
                    <p class="text-xs text-gray-500">Class Advisor</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
            <button onclick="filterView('incoming')" id="tab-incoming" class="w-full flex items-center justify-between px-4 py-3 bg-brand-50 text-brand-900 rounded-xl font-bold transition border border-brand-100 shadow-sm">
                <div class="flex items-center gap-3"><i class="fas fa-inbox"></i> Incoming</div>
                <span id="badge-incoming" class="bg-brand-600 text-white text-xs px-2 py-0.5 rounded-full shadow-sm">0</span>
            </button>
            <button onclick="filterView('escalated')" id="tab-escalated" class="w-full flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-xl font-medium transition">
                <i class="fas fa-share w-5"></i> Escalated
            </button>
            <button onclick="filterView('history')" id="tab-history" class="w-full flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-xl font-medium transition">
                <i class="fas fa-history w-5"></i> History
            </button>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <button id="logout-btn" class="w-full py-2 flex items-center justify-center gap-2 text-red-500 hover:bg-red-50 rounded-lg transition text-sm font-bold">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 shrink-0 z-10 shadow-sm">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-500 p-2 -ml-2"><i class="fas fa-bars text-xl"></i></button>
                <h2 class="text-lg md:text-xl font-bold text-gray-800 truncate" id="view-title">Incoming Requests</h2>
            </div>
            <div class="hidden md:flex items-center gap-2 px-3 py-1 bg-green-50 rounded-full border border-green-100">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-bold text-green-700">System Live</span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50" id="main-scroll">
            <div id="request-feed" class="max-w-3xl mx-auto space-y-4 pb-20">
                </div>
            
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-64 text-center">
                <div class="w-16 h-16 bg-white border border-gray-200 rounded-full flex items-center justify-center text-gray-300 text-3xl mb-4 shadow-sm">
                    <i class="fas fa-check"></i>
                </div>
                <h3 class="text-gray-900 font-bold">All caught up!</h3>
                <p class="text-gray-500 text-sm">No pending requests in this category.</p>
            </div>
        </div>
    </main>

    <div id="action-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl p-6 w-[90%] max-w-md scale-100 transition-transform">
            <h3 class="text-lg font-bold text-gray-900 mb-2" id="modal-title">Confirm Action</h3>
            <p class="text-sm text-gray-500 mb-4" id="modal-desc">Are you sure?</p>
            
            <div id="reject-controls" class="hidden space-y-3">
                <textarea id="reason-input" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="Reason for rejection..." rows="3"></textarea>
                <label class="flex items-center gap-3 p-3 border border-red-100 bg-red-50 rounded-lg cursor-pointer">
                    <input type="checkbox" id="block-check" class="w-4 h-4 text-red-600 focus:ring-red-500 rounded border-gray-300">
                    <span class="text-sm font-bold text-red-700">Block Student (Spam)</span>
                </label>
            </div>

            <div class="flex gap-3 justify-end mt-6">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg font-medium transition text-sm">Cancel</button>
                <button id="confirm-btn" class="px-6 py-2 bg-brand-600 text-white rounded-lg font-bold shadow-lg hover:bg-brand-700 transition text-sm">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        import { PermissionService } from '../../assets/js/permission-flow.js';

        let currentView = 'incoming';
        let activeRequestId = null;
        let activeStudentId = null;

        // --- UI TOGGLE ---
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('mobile-overlay');
            sb.classList.toggle('-translate-x-full');
            ov.classList.toggle('hidden');
        };

        // --- AUTH ---
        auth.onAuthStateChanged(async user => {
            if (!user) location.href = '../../public/login.html';
            const profile = await db.collection('users').doc(user.uid).get();
            const data = profile.data();
            
            // Security Check
            if (data.role !== 'teacher') {
                alert("Unauthorized: Access restricted to Faculty.");
                location.href = '../../public/login.html';
                return;
            }

            document.getElementById('teacher-name').innerText = data.displayName || "Faculty";
            document.getElementById('avatar-initial').innerText = (data.displayName || "T").charAt(0);
            loadData();
        });

        // --- NAVIGATION ---
        window.filterView = (view) => {
            currentView = view;
            if(window.innerWidth < 768) window.toggleSidebar(); // Auto-close on mobile

            // Reset Tabs
            document.querySelectorAll('nav button').forEach(b => {
                b.className = "w-full flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-xl font-medium transition";
                if(b.id === 'tab-incoming') b.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-inbox"></i> Incoming</div><span id="badge-incoming" class="bg-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded-full">0</span>`;
            });
            
            const activeTab = document.getElementById(`tab-${view}`);
            activeTab.className = "w-full flex items-center justify-between px-4 py-3 bg-brand-50 text-brand-900 rounded-xl font-bold transition shadow-sm border border-brand-100";
            
            if(view === 'incoming') {
                document.getElementById('view-title').innerText = "Incoming Requests";
                activeTab.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-inbox"></i> Incoming</div><span id="badge-incoming" class="bg-brand-600 text-white text-xs px-2 py-0.5 rounded-full shadow-sm">0</span>`;
            } else if (view === 'escalated') {
                document.getElementById('view-title').innerText = "Escalated to HOD";
            } else {
                document.getElementById('view-title').innerText = "History";
            }
            
            loadData();
        };

        // --- DATA LOAD ---
        async function loadData() {
            const feed = document.getElementById('request-feed');
            const empty = document.getElementById('empty-state');
            feed.innerHTML = '<div class="p-12 text-center text-gray-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></div>';

            const user = auth.currentUser;
            const profileSnap = await db.collection('users').doc(user.uid).get();
            const myDept = profileSnap.data().department;

            let query = db.collection('permissions');

            if (currentView === 'incoming') {
                query = query.where('status', '==', 'PENDING_TEACHER').where('department', '==', myDept);
            } else if (currentView === 'escalated') {
                query = query.where('status', '==', 'PENDING_HOD').where('department', '==', myDept);
            } else {
                query = query.where('approvals.teacher.uid', '==', user.uid);
            }

            query.orderBy('timestamp', 'desc').onSnapshot(snap => {
                if(currentView === 'incoming') document.getElementById('badge-incoming').innerText = snap.size;
                
                if(snap.empty) {
                    feed.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }
                
                empty.classList.add('hidden');
                feed.innerHTML = '';

                snap.forEach(doc => {
                    const data = doc.data();
                    feed.appendChild(createCard(doc.id, data));
                });
            });
        }

        function createCard(id, data) {
            const d1 = new Date(data.startDate);
            const d2 = new Date(data.endDate);
            const days = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            const isMedical = data.reasonType === 'Medical';
            const willEscalate = (days > 2 || isMedical) && currentView === 'incoming';

            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition relative overflow-hidden";
            
            // Priority Styling
            if(isMedical) card.classList.add('border-l-4', 'border-l-red-500');
            else if(days > 2) card.classList.add('border-l-4', 'border-l-orange-500');
            else card.classList.add('border-l-4', 'border-l-brand-600');

            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 text-lg border border-gray-200">
                            ${data.studentName.charAt(0)}
                        </div>
                        <div>
                            <h4 class="text-base font-bold text-gray-900 leading-tight">${data.studentName}</h4>
                            <p class="text-xs text-gray-500 font-mono">${data.rollNumber}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="block text-xl font-black text-gray-800 leading-none">${days}d</span>
                        <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wide">${data.reasonType}</span>
                    </div>
                </div>

                <div class="flex gap-2 mb-3">
                    ${willEscalate ? '<span class="bg-orange-50 text-orange-700 px-2 py-1 rounded text-[10px] font-bold border border-orange-100 flex items-center gap-1 w-fit"><i class="fas fa-arrow-up"></i> HOD Required</span>' : ''}
                    <span class="bg-gray-50 text-gray-600 px-2 py-1 rounded text-[10px] font-bold border border-gray-100 w-fit">${new Date(data.startDate).toLocaleDateString()} - ${new Date(data.endDate).toLocaleDateString()}</span>
                </div>

                <div class="bg-gray-50 p-3 rounded-xl text-sm text-gray-600 italic border border-gray-100 mb-4">
                    "${data.reason}"
                </div>

                ${currentView === 'incoming' ? `
                <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-100">
                    <button onclick="prepAction('${id}', '${data.studentID}', 'reject')" class="py-2.5 border border-red-100 text-red-600 bg-white hover:bg-red-50 rounded-lg font-bold text-sm transition">Reject</button>
                    <button onclick="prepAction('${id}', '${data.studentID}', 'approve', ${willEscalate})" class="py-2.5 bg-gray-900 text-white hover:bg-gray-800 rounded-lg font-bold text-sm shadow-md transition">
                        ${willEscalate ? 'Endorse' : 'Approve'}
                    </button>
                </div>` : ''}
            `;
            return card;
        }

        // --- ACTIONS ---
        window.prepAction = (id, studentId, action, isEscalation) => {
            activeRequestId = id;
            activeStudentId = studentId;
            const modal = document.getElementById('action-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const rejectControls = document.getElementById('reject-controls');
            const btn = document.getElementById('confirm-btn');

            modal.classList.remove('hidden');

            if (action === 'approve') {
                rejectControls.classList.add('hidden');
                title.innerText = isEscalation ? "Endorse Escalation?" : "Approve Request?";
                desc.innerHTML = isEscalation 
                    ? "This request requires HOD approval. Confirm endorsement?" 
                    : "This will generate a valid pass immediately.";
                
                btn.className = "px-6 py-2 bg-brand-600 text-white rounded-lg font-bold hover:bg-brand-700 shadow-lg";
                btn.innerText = "Confirm";
                
                btn.onclick = async () => {
                    btn.disabled = true; btn.innerText = "Processing...";
                    try {
                        const freshDoc = await db.collection('permissions').doc(activeRequestId).get();
                        await PermissionService.approveRequest(activeRequestId, freshDoc.data());
                        closeModal();
                    } catch(e) { alert(e.message); } 
                    finally { btn.disabled = false; }
                };

            } else {
                rejectControls.classList.remove('hidden');
                title.innerText = "Reject Request";
                desc.innerText = "Please provide a reason.";
                
                btn.className = "px-6 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 shadow-lg";
                btn.innerText = "Reject";

                btn.onclick = async () => {
                    const reason = document.getElementById('reason-input').value;
                    const shouldBlock = document.getElementById('block-check').checked;
                    
                    if(!reason) { alert("Please enter a reason."); return; }
                    
                    btn.disabled = true; btn.innerText = "Processing...";
                    try {
                        if(shouldBlock) {
                            if(confirm("Confirm BLOCK user?")) await PermissionService.blockStudent(activeRequestId, activeStudentId, reason);
                        } else {
                            await PermissionService.rejectRequest(activeRequestId, reason);
                        }
                        closeModal();
                    } catch(e) { alert(e.message); }
                    finally { btn.disabled = false; }
                };
            }
        };

        window.closeModal = () => document.getElementById('action-modal').classList.add('hidden');
        document.getElementById('logout-btn').onclick = () => {
            auth.signOut().then(() => location.href = '../../public/login.html');
        };
    </script>
</body>
</html>
