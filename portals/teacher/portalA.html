<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Teacher Dashboard | UNI-PASS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
<script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
                        warning: { 50: '#fffbeb', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex overflow-hidden">

    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col z-10">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <i class="fas fa-university text-brand-600 text-2xl mr-3"></i>
            <span class="font-bold text-xl tracking-tight text-gray-800">UNI-PASS</span>
        </div>

        <div class="p-6 border-b border-gray-100 bg-brand-50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-brand-200 text-brand-700 flex items-center justify-center font-bold text-lg">T</div>
                <div>
                    <h4 class="text-sm font-bold text-gray-900" id="sidebar-name">Loading...</h4>
                    <p class="text-xs text-brand-600 font-medium">Class Advisor</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto custom-scroll">
            <p class="px-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-2">Workflow</p>
            
            <a href="#" onclick="switchTab('incoming')" id="tab-incoming" class="flex items-center px-3 py-2.5 bg-brand-50 text-brand-700 rounded-lg group font-medium shadow-sm ring-1 ring-brand-200">
                <i class="fas fa-inbox w-6 text-brand-500"></i> Incoming Requests
                <span class="ml-auto bg-brand-600 text-white py-0.5 px-2 rounded-full text-xs font-bold shadow-sm" id="sidebar-badge">0</span>
            </a>

            <a href="#" onclick="switchTab('escalated')" id="tab-escalated" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg group transition-colors">
                <i class="fas fa-share w-6 text-gray-400 group-hover:text-gray-500"></i> Escalated (HOD)
            </a>

            <a href="#" onclick="switchTab('history')" id="tab-history" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg group transition-colors">
                <i class="fas fa-check-circle w-6 text-gray-400 group-hover:text-gray-500"></i> Approved History
            </a>
        </nav>

        <div class="p-4 border-t border-gray-200">
            <button id="logout-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-red-600 transition-colors">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:hidden z-20">
            <span class="font-bold text-lg">Teacher Dashboard</span>
            <button class="text-gray-500"><i class="fas fa-bars text-xl"></i></button>
        </header>

        <div class="flex-1 overflow-y-auto custom-scroll p-4 md:p-8">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900" id="page-title">Incoming Requests</h1>
                        <p class="text-sm text-gray-500 mt-1">Manage leave applications for your assigned batch.</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="loadRequests()" class="p-2 text-gray-400 hover:text-brand-600 transition" title="Refresh">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <div id="requests-feed" class="space-y-4">
                    </div>

                <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-clipboard-check text-3xl text-gray-400"></i>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900">No records found</h3>
                </div>
            </div>
        </div>
    </main>

    <div id="action-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"></div>
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full z-10 p-6">
                <div class="text-center mb-6">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 mb-4" id="modal-icon-bg">
                        <i class="fas fa-question text-blue-600 text-xl" id="modal-icon"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900" id="modal-title">Confirm Action</h3>
                    <p class="text-sm text-gray-500 mt-2" id="modal-desc">Are you sure?</p>
                </div>
                
                <div id="reject-reason-container" class="hidden mb-4">
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Reason</label>
                    <textarea id="reject-reason" class="w-full border border-gray-300 rounded p-2 text-sm" rows="2"></textarea>
                </div>

                <div class="flex gap-3 justify-center">
                    <button onclick="closeModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Cancel</button>
                    <button id="confirm-btn" class="px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-bold">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        import { processApproval } from '../../assets/js/permission-flow.js';

        let currentActionId = null;
        let currentActionType = null;
        let currentRequestData = null;
        let currentSubscription = null;
        let currentTabMode = 'incoming';

        // --- AUTH ---
        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = '../../public/login.html';
            document.getElementById('sidebar-name').innerText = user.displayName || 'Teacher';
            loadRequests('incoming');
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = '../../public/login.html');
        });

        // --- TABS ---
        window.switchTab = (mode) => {
            currentTabMode = mode;
            // Visuals
            document.querySelectorAll('nav a').forEach(el => {
                el.className = "flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg group transition-colors";
            });
            const activeClass = "flex items-center px-3 py-2.5 bg-brand-50 text-brand-700 rounded-lg group font-medium shadow-sm ring-1 ring-brand-200";
            document.getElementById(`tab-${mode}`).className = activeClass;
            
            // Logic
            loadRequests(mode);
        };

        // --- DATA LOADING ---
        window.loadRequests = (mode = currentTabMode) => {
            const feed = document.getElementById('requests-feed');
            const emptyState = document.getElementById('empty-state');
            const title = document.getElementById('page-title');

            if (currentSubscription) currentSubscription(); // Unsubscribe prev

            feed.innerHTML = '<div class="p-8 text-center text-gray-400"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>';

            let query = db.collection('permissions');
            
            if (mode === 'incoming') {
                title.innerText = "Incoming Requests";
                query = query.where('status', '==', 'PENDING_TEACHER');
            } else if (mode === 'escalated') {
                title.innerText = "Escalated to HOD";
                query = query.where('status', '==', 'PENDING_HOD');
            } else if (mode === 'history') {
                title.innerText = "Approval History";
                query = query.where('status', 'in', ['APPROVED', 'REJECTED']);
            }

            currentSubscription = query.orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                feed.innerHTML = '';
                
                if (mode === 'incoming') document.getElementById('sidebar-badge').innerText = snapshot.size;

                if (snapshot.empty) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                snapshot.forEach(doc => {
                    feed.appendChild(createCard(doc.id, doc.data(), mode === 'incoming'));
                });
            }, error => {
                console.error("Query Error:", error);
                feed.innerHTML = `<div class="p-4 text-red-500 bg-red-50 rounded">Error: ${error.message} <br> (Check Console for Index Link)</div>`;
            });
        };

        function createCard(id, data, isActionable) {
            const d1 = new Date(data.startDate);
            const d2 = new Date(data.endDate);
            const days = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            
            // Escalation Check
            const isEscalation = (days > 2) || (data.reasonType === 'Medical');
            
            const div = document.createElement('div');
            div.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col md:flex-row gap-5 relative overflow-hidden";
            
            let statusBadge = '';
            if (data.status === 'PENDING_HOD') statusBadge = `<span class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold ml-2">Waiting for HOD</span>`;
            if (data.status === 'APPROVED') statusBadge = `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold ml-2">Approved</span>`;
            
            div.innerHTML = `
                <div class="flex-shrink-0 flex flex-col items-center justify-center w-full md:w-16 gap-2">
                    <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold border border-gray-200">
                        ${data.studentName.charAt(0)}
                    </div>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-900">${data.studentName} ${statusBadge}</h3>
                    <div class="flex items-center gap-2 text-sm text-gray-500 mt-1">
                        <span class="px-2 py-0.5 rounded bg-gray-100 border border-gray-200 text-xs font-bold">${data.reasonType}</span>
                        <span>${days} Days (${data.startDate} to ${data.endDate})</span>
                    </div>
                    <p class="text-gray-600 text-sm mt-2 italic">"${data.reason}"</p>
                    
                    ${(isActionable && isEscalation) ? `
                        <div class="mt-2 inline-flex items-center gap-2 px-3 py-1 bg-orange-50 text-orange-700 text-xs font-bold rounded-full border border-orange-200">
                            <i class="fas fa-arrow-up"></i> Will Escalate to HOD
                        </div>
                    ` : ''}
                </div>
                
                ${isActionable ? `
                <div class="flex flex-col gap-2 justify-center border-l border-gray-100 pl-4">
                    <button onclick='triggerAction("${id}", "approve", ${JSON.stringify(data)})' class="px-4 py-2 bg-green-600 text-white rounded text-sm font-bold shadow hover:bg-green-700">Approve</button>
                    <button onclick='triggerAction("${id}", "reject", null)' class="px-4 py-2 border border-red-200 text-red-600 rounded text-sm hover:bg-red-50">Reject</button>
                </div>
                ` : ''}
            `;
            return div;
        }

        // --- ACTIONS ---
        window.triggerAction = (id, type, data) => {
            currentActionId = id;
            currentActionType = type;
            currentRequestData = data;
            
            const modal = document.getElementById('action-modal');
            modal.classList.remove('hidden');
            
            const btn = document.getElementById('confirm-btn');
            const rejectBox = document.getElementById('reject-reason-container');
            const desc = document.getElementById('modal-desc');

            if (type === 'approve') {
                rejectBox.classList.add('hidden');
                btn.className = "px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold";
                
                // Smart Text
                const d1 = new Date(data.startDate);
                const d2 = new Date(data.endDate);
                const days = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
                
                if (days > 2 || data.reasonType === 'Medical') {
                    desc.innerHTML = `This request will be <b>ESCALATED to HOD</b> because it is ${days} days long or Medical.`;
                } else {
                    desc.innerText = "This will generate the permission pass immediately.";
                }
            } else {
                rejectBox.classList.remove('hidden');
                btn.className = "px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-bold";
                desc.innerText = "This action cannot be undone.";
            }
        };

        window.closeModal = () => document.getElementById('action-modal').classList.add('hidden');

        document.getElementById('confirm-btn').addEventListener('click', async () => {
            const btn = document.getElementById('confirm-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;
            
            try {
                if (currentActionType === 'reject') {
                    const reason = document.getElementById('reject-reason').value;
                    if (!currentRequestData) currentRequestData = {};
                    currentRequestData.rejectReason = reason;
                }

                await processApproval(currentActionId, currentActionType, 'teacher', currentRequestData || {});
                closeModal();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = "Confirm";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
