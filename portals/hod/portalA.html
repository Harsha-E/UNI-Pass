<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Command Center | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#2563eb', 900: '#1e3a8a' } } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans h-screen flex overflow-hidden">

    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden glass"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white z-50 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col shadow-xl">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-800 bg-slate-950">
            <span class="font-bold text-lg tracking-wider">HOD PORTAL</span>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>

        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xl shadow-lg border border-blue-400">
                    <span id="avatar-initial">H</span>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-gray-100 truncate w-32" id="hod-name">Loading...</h4>
                    <p class="text-xs text-slate-400">Head of Dept</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4 overflow-y-auto">
            <button onclick="filterView('escalated')" id="tab-escalated" class="w-full flex items-center justify-between px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition shadow-md">
                <div class="flex items-center gap-3"><i class="fas fa-file-signature"></i> Approvals</div>
                <span id="badge-pending" class="bg-white text-blue-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button onclick="filterView('history')" id="tab-history" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition">
                <i class="fas fa-history"></i> Audit Logs
            </button>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full flex items-center justify-center gap-2 text-slate-400 hover:text-red-400 transition text-sm font-bold py-2 rounded-lg hover:bg-slate-800">
                <i class="fas fa-sign-out-alt"></i> Secure Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 shrink-0 z-10 shadow-sm">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-500 p-2 -ml-2"><i class="fas fa-bars text-xl"></i></button>
                <h2 class="text-lg md:text-xl font-bold text-gray-800" id="view-title">Escalated Requests</h2>
            </div>
            <div class="hidden md:flex items-center gap-2 px-3 py-1 bg-orange-50 border border-orange-200 rounded-full">
                <span class="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-bold text-orange-700">Action Required</span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-100" id="main-scroll">
            <div id="request-feed" class="max-w-4xl mx-auto space-y-4 pb-20"></div>
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-64 text-center">
                <div class="w-20 h-20 bg-white border border-gray-200 rounded-full flex items-center justify-center text-green-500 text-3xl mb-4 shadow-sm">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <h3 class="text-gray-900 font-bold text-lg">All Caught Up!</h3>
                <p class="text-gray-500 text-sm">No pending escalations require your attention.</p>
            </div>
        </div>
    </main>

    <div id="action-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl p-6 w-[90%] max-w-md scale-100 transition-transform">
            <div class="mb-4">
                <h3 class="text-xl font-bold text-gray-900" id="modal-title">Verification</h3>
                <p class="text-sm text-gray-500" id="modal-desc">Confirm your decision.</p>
            </div>
            <div id="approve-controls" class="hidden space-y-4">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <p class="text-xs font-bold text-blue-600 uppercase mb-2">Modify Duration (Optional)</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-gray-500 font-bold">From</label>
                            <input id="mod-start" type="text" class="w-full bg-white border border-blue-200 rounded p-2 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 font-bold">To</label>
                            <input id="mod-end" type="text" class="w-full bg-white border border-blue-200 rounded p-2 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>
            </div>
            <div id="reject-controls" class="hidden space-y-3">
                <textarea id="reason-input" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none resize-none" placeholder="Reason for rejection..." rows="3"></textarea>
                <label class="flex items-start gap-3 p-3 border border-red-100 bg-red-50 rounded-lg cursor-pointer hover:bg-red-100 transition">
                    <input type="checkbox" id="block-check" class="mt-1 text-red-600 focus:ring-red-500 rounded border-red-300">
                    <div>
                        <span class="block text-sm font-bold text-red-700">Disciplinary Block</span>
                        <span class="block text-xs text-red-500">Locks student account.</span>
                    </div>
                </label>
            </div>
            <div class="flex gap-3 justify-end mt-6 pt-4 border-t border-gray-100">
                <button onclick="closeModal()" class="px-5 py-2.5 text-gray-500 hover:bg-gray-100 rounded-xl font-bold text-sm transition">Cancel</button>
                <button id="confirm-btn" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold shadow-lg hover:bg-blue-700 transition transform active:scale-95">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        import { PermissionService } from '../../assets/js/permission-flow.js';

        let currentView = 'escalated';
        let activeRequestId = null;
        let activeStudentId = null;
        let originalRequestData = null;
        let fpStart, fpEnd;

        // --- GLOBAL UI HELPERS ---
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('mobile-overlay');
            sb.classList.toggle('-translate-x-full');
            ov.classList.toggle('hidden');
        };

        window.closeModal = () => document.getElementById('action-modal').classList.add('hidden');

        // --- AUTH ---
        auth.onAuthStateChanged(async user => {
            if (!user) location.href = '../../public/login.html';
            const doc = await db.collection('users').doc(user.uid).get();
            if (!doc.exists) return;
            const data = doc.data();
            document.getElementById('hod-name').innerText = data.displayName || "HOD";
            document.getElementById('avatar-initial').innerText = (data.displayName || "H").charAt(0);
            
            fpStart = flatpickr("#mod-start", { dateFormat: "Y-m-d" });
            fpEnd = flatpickr("#mod-end", { dateFormat: "Y-m-d" });
            loadData();
        });

        // --- NAVIGATION ---
        window.filterView = (view) => {
            currentView = view;
            if(window.innerWidth < 768) window.toggleSidebar();
            document.getElementById('tab-escalated').className = view === 'escalated' ? "w-full flex items-center justify-between px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition shadow-md" : "w-full flex items-center justify-between px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition";
            document.getElementById('tab-history').className = view === 'history' ? "w-full flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition shadow-md" : "w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition";
            document.getElementById('view-title').innerText = view === 'escalated' ? "Escalated Requests" : "Audit History";
            loadData();
        };

        // --- DATA ---
        function loadData() {
            const feed = document.getElementById('request-feed');
            const empty = document.getElementById('empty-state');
            feed.innerHTML = '<div class="p-8 text-center"><i class="fas fa-circle-notch fa-spin text-blue-600"></i></div>';
            let query = db.collection('permissions');
            if (currentView === 'escalated') query = query.where('status', '==', 'PENDING_HOD');
            else query = query.where('status', 'in', ['APPROVED', 'REJECTED']);

            query.orderBy('timestamp', 'desc').onSnapshot(snap => {
                feed.innerHTML = '';
                if(currentView === 'escalated') document.getElementById('badge-pending').innerText = snap.size;
                if(snap.empty) { empty.classList.remove('hidden'); return; }
                empty.classList.add('hidden');
                snap.forEach(doc => feed.appendChild(createCard(doc.id, doc.data())));
            });
        }

        function createCard(id, data) {
            const d1 = new Date(data.startDate);
            const d2 = new Date(data.endDate);
            const days = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            const endorser = data.approvals?.teacher?.name || "Faculty";

            const card = document.createElement('div');
            card.className = `bg-white p-5 rounded-2xl border border-gray-200 shadow-sm hover:shadow-lg transition relative overflow-hidden group ${data.reasonType === 'Medical' ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-orange-500'}`;
            
            card.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-500 text-lg border border-slate-200">${data.studentName.charAt(0)}</div>
                        <div>
                            <h4 class="text-lg font-bold text-gray-900">${data.studentName}</h4>
                            <div class="flex items-center gap-2 text-sm text-gray-500">
                                <span class="font-mono">${data.rollNumber}</span>
                                <span class="text-slate-300">|</span>
                                <span class="text-blue-600 font-medium text-xs">Via ${endorser}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right ml-auto md:ml-0">
                        <span class="block text-2xl font-black text-gray-800 leading-none">${days}<span class="text-sm font-medium text-gray-400 ml-1">Days</span></span>
                        <span class="text-xs bg-gray-100 px-2 py-1 rounded mt-1 font-bold text-gray-500 uppercase inline-block">${data.reasonType}</span>
                    </div>
                </div>
                <div class="mt-4 bg-orange-50 p-3 rounded-xl text-sm text-orange-800 border border-orange-100 italic">"${data.reason}"</div>
            `;

            if (currentView === 'escalated') {
                const footer = document.createElement('div');
                footer.className = "mt-5 flex gap-3 pt-4 border-t border-gray-100";
                
                const rejectBtn = document.createElement('button');
                rejectBtn.className = "flex-1 py-2.5 border border-red-200 text-red-600 bg-white hover:bg-red-50 rounded-lg font-bold text-sm transition";
                rejectBtn.textContent = "Reject";
                rejectBtn.onclick = () => window.prepAction(id, data.studentID, 'reject', data);

                const approveBtn = document.createElement('button');
                approveBtn.className = "flex-[2] py-2.5 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-bold text-sm shadow-md transition transform active:scale-[0.98]";
                approveBtn.textContent = "Review & Approve";
                approveBtn.onclick = () => window.prepAction(id, data.studentID, 'approve', data);

                footer.appendChild(rejectBtn);
                footer.appendChild(approveBtn);
                card.appendChild(footer);
            }
            return card;
        }

        window.prepAction = (id, studentId, action, rawData) => {
            activeRequestId = id; 
            activeStudentId = studentId;
            originalRequestData = rawData;

            const modal = document.getElementById('action-modal');
            const title = document.getElementById('modal-title');
            const rejectControls = document.getElementById('reject-controls');
            const approveControls = document.getElementById('approve-controls');
            const btn = document.getElementById('confirm-btn');

            modal.classList.remove('hidden');

            if (action === 'approve') {
                rejectControls.classList.add('hidden');
                approveControls.classList.remove('hidden');
                title.innerText = "Final Approval";
                btn.className = "px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold shadow-lg";
                btn.textContent = "Sign & Authorize";
                fpStart.setDate(rawData.startDate);
                fpEnd.setDate(rawData.endDate);
                
                btn.onclick = async () => {
                    btn.disabled = true; btn.innerText = "Signing...";
                    try {
                        const newStart = document.getElementById('mod-start').value;
                        const newEnd = document.getElementById('mod-end').value;
                        if (newStart !== rawData.startDate || newEnd !== rawData.endDate) {
                            await db.collection('permissions').doc(id).update({ startDate: newStart, endDate: newEnd, dateModifiedBy: "HOD" });
                        }
                        const freshSnap = await db.collection('permissions').doc(id).get();
                        await PermissionService.approveRequest(id, freshSnap.data());
                        closeModal();
                    } catch(e) { alert(e.message); } finally { btn.disabled = false; }
                };
            } else {
                approveControls.classList.add('hidden');
                rejectControls.classList.remove('hidden');
                title.innerText = "Reject Request";
                btn.className = "px-6 py-2.5 bg-red-600 text-white rounded-xl font-bold shadow-lg";
                btn.textContent = "Confirm Rejection";
                btn.onclick = async () => {
                    const reason = document.getElementById('reason-input').value;
                    if(!reason) return alert("Reason required.");
                    btn.disabled = true; btn.innerText = "Processing...";
                    try {
                        if(document.getElementById('block-check').checked) await PermissionService.blockStudent(id, studentId, reason);
                        else await PermissionService.rejectRequest(id, reason);
                        closeModal();
                    } catch(e) { alert(e.message); } finally { btn.disabled = false; }
                };
            }
        };

        document.getElementById('logout-btn').onclick = () => {
            auth.signOut().then(() => location.href = '../../public/login.html');
        };
    </script>
</body>
</html>
