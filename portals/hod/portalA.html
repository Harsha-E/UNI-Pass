<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Command Center | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { 600: '#2563eb', 900: '#1e3a8a' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col z-20 shadow-xl">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <span class="font-bold text-lg tracking-wider">HOD PORTAL</span>
        </div>

        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/30">
                    <span id="avatar-initial">H</span>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-gray-100" id="hod-name">Loading...</h4>
                    <p class="text-xs text-slate-400">Head of Department</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4">
            <button onclick="filterView('escalated')" id="tab-escalated" class="w-full flex items-center justify-between px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition shadow-md">
                <div class="flex items-center gap-3"><i class="fas fa-file-signature"></i> Approvals</div>
                <span id="badge-pending" class="bg-white text-blue-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
            
            <button onclick="filterView('history')" id="tab-history" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition">
                <i class="fas fa-history"></i> Audit Logs
            </button>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full flex items-center justify-center gap-2 text-slate-400 hover:text-red-400 transition text-sm font-bold py-2">
                <i class="fas fa-sign-out-alt"></i> Secure Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-10 shadow-sm">
            <h2 class="text-xl font-bold text-gray-800" id="view-title">Escalated Requests</h2>
            <div class="flex items-center gap-2 px-3 py-1 bg-orange-50 border border-orange-200 rounded-full">
                <span class="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-bold text-orange-700">Executive Action Required</span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8" id="main-scroll">
            <div id="request-feed" class="max-w-4xl mx-auto space-y-4">
                </div>
            
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-64 text-center">
                <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center text-green-500 text-3xl mb-4 shadow-sm">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <h3 class="text-gray-900 font-bold text-lg">All Caught Up!</h3>
                <p class="text-gray-500 text-sm">No pending escalations require your attention.</p>
            </div>
        </div>
    </main>

    <div id="action-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md scale-100 transition-transform">
            
            <div class="mb-4">
                <h3 class="text-xl font-bold text-gray-900" id="modal-title">Verification</h3>
                <p class="text-sm text-gray-500" id="modal-desc">Confirm your decision.</p>
            </div>
            
            <div id="approve-controls" class="hidden space-y-4">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <p class="text-xs font-bold text-blue-600 uppercase mb-2">Modify Duration (Optional)</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-gray-500 font-bold">From</label>
                            <input id="mod-start" type="text" class="w-full bg-white border border-blue-200 rounded p-2 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 font-bold">To</label>
                            <input id="mod-end" type="text" class="w-full bg-white border border-blue-200 rounded p-2 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <p class="text-[10px] text-blue-400 mt-2 italic"><i class="fas fa-info-circle"></i> Changing dates updates the final pass.</p>
                </div>
            </div>

            <div id="reject-controls" class="hidden space-y-3">
                <textarea id="reason-input" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none resize-none" placeholder="Reason for rejection..." rows="3"></textarea>
                
                <label class="flex items-start gap-3 p-3 border border-red-100 bg-red-50 rounded-lg cursor-pointer hover:bg-red-100 transition">
                    <input type="checkbox" id="block-check" class="mt-1 text-red-600 focus:ring-red-500 rounded border-red-300">
                    <div>
                        <span class="block text-sm font-bold text-red-700">Disciplinary Block</span>
                        <span class="block text-xs text-red-500">Locks student account. Requires Admin to undo.</span>
                    </div>
                </label>
            </div>

            <div class="flex gap-3 justify-end mt-6 pt-4 border-t border-gray-100">
                <button onclick="closeModal()" class="px-5 py-2.5 text-gray-500 hover:bg-gray-100 rounded-xl font-bold text-sm transition">Cancel</button>
                <button id="confirm-btn" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold shadow-lg hover:bg-blue-700 transition transform active:scale-95">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        import { PermissionService } from '../../assets/js/permission-flow.js';

        let currentView = 'escalated';
        let activeRequestId = null;
        let activeStudentId = null;
        let originalRequestData = null; // Store for date modification

        // Flatpickr Instances
        let fpStart, fpEnd;

        // --- AUTH ---
        auth.onAuthStateChanged(async user => {
            if (!user) location.href = '../../public/login.html';
            const profile = await db.collection('users').doc(user.uid).get();
            const data = profile.data();
            document.getElementById('hod-name').innerText = data.displayName || "HOD";
            document.getElementById('avatar-initial').innerText = (data.displayName || "H").charAt(0);
            
            // Init Date Pickers
            fpStart = flatpickr("#mod-start", { dateFormat: "Y-m-d" });
            fpEnd = flatpickr("#mod-end", { dateFormat: "Y-m-d" });

            loadData();
        });

        // --- NAVIGATION ---
        window.filterView = (view) => {
            currentView = view;
            
            // Reset Tabs
            document.getElementById('tab-escalated').className = "w-full flex items-center justify-between px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition";
            document.getElementById('tab-history').className = "w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition";
            
            // Set Active
            const activeTab = document.getElementById(`tab-${view}`);
            activeTab.className = "w-full flex items-center justify-between px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition shadow-md";
            
            document.getElementById('view-title').innerText = view === 'escalated' ? "Escalated Requests" : "Audit History";
            loadData();
        };

        // --- DATA LOAD ---
        function loadData() {
            const feed = document.getElementById('request-feed');
            const empty = document.getElementById('empty-state');
            feed.innerHTML = '<div class="p-8 text-center"><i class="fas fa-circle-notch fa-spin text-blue-600"></i></div>';

            let query = db.collection('permissions');

            if (currentView === 'escalated') query = query.where('status', '==', 'PENDING_HOD');
            else query = query.where('status', 'in', ['APPROVED', 'REJECTED']);

            query.orderBy('timestamp', 'desc').onSnapshot(snap => {
                feed.innerHTML = '';
                if(currentView === 'escalated') document.getElementById('badge-pending').innerText = snap.size;

                if(snap.empty) {
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');

                snap.forEach(doc => {
                    feed.appendChild(createCard(doc.id, doc.data()));
                });
            });
        }

        function createCard(id, data) {
            const d1 = new Date(data.startDate);
            const d2 = new Date(data.endDate);
            const days = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            const isMedical = data.reasonType === 'Medical';
            const endorser = data.approvals?.teacher?.name || "Faculty";

            // Encode data for passing to modal
            const safeData = encodeURIComponent(JSON.stringify(data));

            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-2xl border border-gray-200 shadow-sm hover:shadow-lg transition relative overflow-hidden group";
            const borderClass = isMedical ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-orange-500';
            card.className += ` ${borderClass}`;

            card.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-500 text-xl border border-slate-200">
                            ${data.studentName.charAt(0)}
                        </div>
                        <div>
                            <h4 class="text-xl font-bold text-gray-900">${data.studentName}</h4>
                            <div class="flex items-center gap-2 text-sm text-gray-500">
                                <span class="font-mono">${data.rollNumber}</span>
                                <span class="text-slate-300">|</span>
                                <span class="text-blue-600 font-medium">Endorsed by ${endorser}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="inline-flex flex-col items-end">
                            <span class="text-3xl font-black text-gray-800 leading-none">${days}<span class="text-sm font-medium text-gray-400 ml-1">Days</span></span>
                            <span class="text-xs bg-gray-100 px-2 py-1 rounded mt-1 font-bold text-gray-500 uppercase tracking-wide">${data.reasonType}</span>
                        </div>
                    </div>
                </div>

                <div class="mt-5 bg-orange-50 p-4 rounded-xl text-sm text-orange-800 border border-orange-100 italic">
                    <i class="fas fa-quote-left text-orange-300 mr-2"></i> ${data.reason}
                </div>

                ${currentView === 'escalated' ? `
                <div class="mt-6 flex gap-4 pt-4 border-t border-gray-100">
                    <button onclick="prepAction('${id}', '${data.studentID}', 'reject', '${safeData}')" class="px-6 py-2.5 border border-red-200 text-red-600 bg-white hover:bg-red-50 rounded-lg font-bold text-sm transition">Reject / Block</button>
                    <button onclick="prepAction('${id}', '${data.studentID}', 'approve', '${safeData}')" class="flex-1 py-2.5 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-bold text-sm shadow-md shadow-blue-200 transition transform active:scale-[0.98]">
                        Review & Approve
                    </button>
                </div>
                ` : ''}
            `;
            return card;
        }

        window.prepAction = (id, studentId, action, dataString) => {
            activeRequestId = id;
            activeStudentId = studentId;
            originalRequestData = JSON.parse(decodeURIComponent(dataString));

            const modal = document.getElementById('action-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const rejectControls = document.getElementById('reject-controls');
            const approveControls = document.getElementById('approve-controls');
            const btn = document.getElementById('confirm-btn');

            modal.classList.remove('hidden');

            if (action === 'approve') {
                rejectControls.classList.add('hidden');
                approveControls.classList.remove('hidden');
                
                title.innerText = "Final Approval";
                desc.innerHTML = "Review and confirm. You can <b>modify the dates</b> if needed before signing.";
                btn.className = "px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg";
                btn.innerText = "Sign & Authorize";
                
                // Pre-fill Date Pickers with original request dates
                fpStart.setDate(originalRequestData.startDate);
                fpEnd.setDate(originalRequestData.endDate);
                
                btn.onclick = async () => {
                    btn.disabled = true; btn.innerText = "Signing...";
                    try {
                        const newStart = document.getElementById('mod-start').value;
                        const newEnd = document.getElementById('mod-end').value;

                        // 1. Check if dates were modified
                        if (newStart !== originalRequestData.startDate || newEnd !== originalRequestData.endDate) {
                            await db.collection('permissions').doc(activeRequestId).update({
                                startDate: newStart,
                                endDate: newEnd,
                                dateModifiedBy: "HOD" // Audit trail
                            });
                        }

                        // 2. Approve
                        const freshDoc = await db.collection('permissions').doc(activeRequestId).get();
                        await PermissionService.approveRequest(activeRequestId, freshDoc.data());
                        closeModal();
                    } catch(e) { alert(e.message); } 
                    finally { btn.disabled = false; }
                };

            } else {
                approveControls.classList.add('hidden');
                rejectControls.classList.remove('hidden');
                
                title.innerText = "Reject Request";
                desc.innerText = "This action is final. Use the block option only for severe cases.";
                btn.className = "px-6 py-2.5 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 shadow-lg";
                btn.innerText = "Reject Request";

                btn.onclick = async () => {
                    const reason = document.getElementById('reason-input').value;
                    const shouldBlock = document.getElementById('block-check').checked;
                    
                    if(!reason) { alert("Please enter a reason."); return; }
                    
                    btn.disabled = true; btn.innerText = "Processing...";
                    try {
                        if(shouldBlock) {
                            if(confirm("CONFIRM BLOCK: This student will be locked out of the system.")) {
                                await PermissionService.blockStudent(activeRequestId, activeStudentId, reason);
                            }
                        } else {
                            await PermissionService.rejectRequest(activeRequestId, reason);
                        }
                        closeModal();
                    } catch(e) { alert(e.message); }
                    finally { btn.disabled = false; }
                };
            }
        };

        window.closeModal = () => document.getElementById('action-modal').classList.add('hidden');
        document.getElementById('logout-btn').onclick = () => {
            sessionStorage.clear();
            auth.signOut().then(() => location.href = '../../public/login.html');
        };
    </script>
</body>
</html>
