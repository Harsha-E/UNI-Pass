<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Inventory | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-gray-50 font-sans pb-24">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="logout-btn" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-power-off"></i>
                </button>
                <h1 class="font-bold text-lg text-gray-800">Lab Inventory</h1>
            </div>
            <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 shadow-sm">
                <i class="fas fa-flask text-sm"></i>
            </div>
        </div>
        <div class="max-w-2xl mx-auto px-4 py-3">
            <input type="text" id="search-input" placeholder="Search equipment..." class="w-full px-4 py-3 bg-gray-100 rounded-xl border-none focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-3" id="inventory-list"></main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 pb-safe z-40">
        <div class="max-w-md mx-auto grid grid-cols-3 h-20">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-blue-600">
                <i class="fas fa-plus-circle text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Request</span>
            </a>
            <a href="lab.html" class="flex flex-col items-center justify-center text-blue-600">
                <i class="fas fa-flask text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Lab</span>
            </a>
            <a href="portalB.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-blue-600">
                <i class="fas fa-history text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">History</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        
        document.getElementById('logout-btn').onclick = async () => {
            if(confirm("Logout?")) { sessionStorage.clear(); await auth.signOut(); location.href = '../../public/login.html'; }
        };

        // Inventory rendering logic remains the same...
    </script>
</body>
</html>
