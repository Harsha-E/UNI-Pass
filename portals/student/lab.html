<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Inventory | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-gray-50 font-sans pb-24">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="logout-btn" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-power-off"></i>
                </button>
                <h1 class="font-bold text-lg text-gray-800">Lab Inventory</h1>
            </div>
            <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 shadow-sm">
                <i class="fas fa-flask text-sm"></i>
            </div>
        </div>
        <div class="max-w-2xl mx-auto px-4 pb-4">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Search equipment..." class="w-full pl-10 pr-4 py-3 bg-gray-100 rounded-xl border-none focus:ring-2 focus:ring-blue-500 outline-none transition text-sm font-medium">
            </div>
        </div>
    </header>

    <div class="max-w-2xl mx-auto px-4 pt-4 overflow-x-auto no-scrollbar flex gap-3 mb-4" id="category-filters">
        <button class="px-4 py-2 bg-blue-600 text-white rounded-full text-xs font-bold whitespace-nowrap shadow-md">All</button>
        <button class="px-4 py-2 bg-white text-gray-500 border border-gray-200 rounded-full text-xs font-bold whitespace-nowrap">Chemicals</button>
        <button class="px-4 py-2 bg-white text-gray-500 border border-gray-200 rounded-full text-xs font-bold whitespace-nowrap">Electronics</button>
        <button class="px-4 py-2 bg-white text-gray-500 border border-gray-200 rounded-full text-xs font-bold whitespace-nowrap">Instruments</button>
    </div>

    <main class="max-w-2xl mx-auto p-4 space-y-3" id="inventory-list">
        <div class="text-center py-12 text-gray-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe z-40">
        <div class="max-w-md mx-auto grid grid-cols-4 h-20">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600">
                <i class="fas fa-plus-circle text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Request</span>
            </a>
            <a href="lab.html" class="flex flex-col items-center justify-center text-blue-600">
                <i class="fas fa-flask text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Lab</span>
            </a>
            <a href="portalC.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600 transition">
                <i class="fas fa-book text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Resources</span>
            </a>
            <a href="portalB.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600 transition">
                <i class="fas fa-history text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">History</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';
        
        document.getElementById('logout-btn').onclick = async () => {
            if(confirm("Logout?")) { sessionStorage.clear(); await auth.signOut(); location.href = '../../public/login.html'; }
        };

        const list = document.getElementById('inventory-list');
        const searchInput = document.getElementById('search-input');
        let allItems = [];

        db.collection('inventory').onSnapshot(snap => {
            allItems = [];
            snap.forEach(doc => allItems.push({ id: doc.id, ...doc.data() }));
            renderItems(allItems);
        });

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allItems.filter(item => (item.itemName||"").toLowerCase().includes(term) || (item.category||"").toLowerCase().includes(term));
            renderItems(filtered);
        });

        function renderItems(items) {
            list.innerHTML = '';
            if(items.length === 0) { list.innerHTML = `<div class="text-center py-10 text-gray-400"><p>No items found.</p></div>`; return; }
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center";
                card.innerHTML = `<div class="flex items-center gap-4"><div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 font-bold">${(item.itemName||"L").charAt(0)}</div><div><h3 class="font-bold text-gray-800 text-sm">${item.itemName}</h3><p class="text-xs text-gray-400">${item.category}</p></div></div><div class="text-right"><p class="text-xs font-bold text-gray-600">${item.quantity} units</p></div>`;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
