<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My History | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-gray-50 font-sans pb-20">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="font-bold text-lg text-gray-800">Request History</h1>
            <div class="text-xs font-bold text-gray-400 uppercase tracking-wider" id="req-count">0 Requests</div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4" id="history-feed">
        <div class="text-center py-12 text-gray-400">
            <i class="fas fa-circle-notch fa-spin text-2xl"></i>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 pb-safe z-40">
        <div class="max-w-md mx-auto grid grid-cols-2 h-16">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 transition">
                <i class="fas fa-plus-circle text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">New Request</span>
            </a>
            <a href="portalB.html" class="flex flex-col items-center justify-center text-blue-600">
                <i class="fas fa-history text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">History</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        // Make jsPDF available globally for the onclick handler
        window.jsPDF = window.jspdf.jsPDF;

        auth.onAuthStateChanged(user => {
            if (user) loadHistory(user.uid);
            else location.href = '../../public/login.html';
        });

        function loadHistory(uid) {
            db.collection('permissions')
                .where('studentID', '==', uid)
                .orderBy('timestamp', 'desc')
                .onSnapshot(snap => {
                    const feed = document.getElementById('history-feed');
                    document.getElementById('req-count').innerText = `${snap.size} Requests`;
                    feed.innerHTML = '';

                    if (snap.empty) {
                        feed.innerHTML = `
                            <div class="text-center py-12 text-gray-400">
                                <i class="fas fa-folder-open text-4xl mb-3 text-gray-300"></i>
                                <p>No history yet.</p>
                            </div>`;
                        return;
                    }

                    snap.forEach(doc => {
                        const data = doc.data();
                        const isApproved = data.status === 'APPROVED';
                        
                        // Status Config
                        let statusColor = 'bg-yellow-100 text-yellow-700 border-yellow-200';
                        let statusIcon = 'fa-clock';
                        let statusText = 'Pending';

                        if (isApproved) {
                            statusColor = 'bg-green-100 text-green-700 border-green-200';
                            statusIcon = 'fa-check-circle';
                            statusText = 'Approved';
                        } else if (data.status.includes('REJECTED')) {
                            statusColor = 'bg-red-100 text-red-700 border-red-200';
                            statusIcon = 'fa-times-circle';
                            statusText = 'Rejected';
                        }

                        // Prepare data string for PDF
                        const safeData = encodeURIComponent(JSON.stringify({ ...data, id: doc.id }));

                        const card = document.createElement('div');
                        card.className = "bg-white p-5 rounded-2xl border border-gray-200 shadow-sm relative overflow-hidden";
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold uppercase tracking-wide border ${statusColor}">
                                        <i class="fas ${statusIcon}"></i> ${statusText}
                                    </span>
                                    <p class="text-xs text-gray-400 mt-2 font-mono">${new Date(data.timestamp).toLocaleDateString()}</p>
                                </div>
                                <div class="text-right">
                                    <span class="block text-lg font-black text-gray-800">${data.reasonType}</span>
                                </div>
                            </div>

                            <div class="bg-gray-50 p-3 rounded-xl mb-4 border border-gray-100">
                                <div class="flex justify-between text-sm">
                                    <span class="text-gray-500 font-bold text-xs uppercase">From</span>
                                    <span class="font-bold text-gray-800">${new Date(data.startDate).toLocaleDateString()}</span>
                                </div>
                                <div class="h-px bg-gray-200 my-2"></div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-gray-500 font-bold text-xs uppercase">To</span>
                                    <span class="font-bold text-gray-800">${new Date(data.endDate).toLocaleDateString()}</span>
                                </div>
                            </div>

                            ${isApproved ? `
                            <button onclick="downloadPass('${safeData}')" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-200 hover:bg-blue-700 transition flex items-center justify-center gap-2">
                                <i class="fas fa-file-pdf"></i> Download Official Pass
                            </button>
                            ` : ''}

                            ${data.status.includes('REJECTED') ? `
                            <div class="text-xs text-red-500 bg-red-50 p-3 rounded-lg border border-red-100 italic">
                                <strong>Reason:</strong> ${data.rejectionReason || 'Contact Faculty'}
                            </div>
                            ` : ''}
                        `;
                        feed.appendChild(card);
                    });
                });
        }

        // --- PDF GENERATOR (Same Professional Logic) ---
        window.downloadPass = (encodedData) => {
            const data = JSON.parse(decodeURIComponent(encodedData));
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header
            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 40, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("UNI-PASS | Official Gate Pass", 105, 20, null, null, "center");
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("MVGR College of Engineering", 105, 30, null, null, "center");

            // Status
            doc.setFillColor(220, 252, 231);
            doc.setDrawColor(22, 163, 74);
            doc.roundedRect(70, 50, 70, 15, 3, 3, 'FD');
            doc.setTextColor(22, 101, 52);
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text("ACCESS GRANTED", 105, 60, null, null, "center");

            // Info
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            doc.text(data.studentName, 105, 80, null, null, "center");
            
            doc.setTextColor(100, 100, 100);
            doc.setFontSize(12);
            doc.setFont("courier", "bold");
            doc.text(data.rollNumber, 105, 88, null, null, "center");

            // Dates
            doc.setDrawColor(200, 200, 200);
            doc.line(20, 100, 190, 100);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(50, 50, 50);
            doc.text("Valid From:", 40, 115);
            doc.text("Valid Until:", 140, 115);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(14);
            doc.text(new Date(data.startDate).toLocaleDateString(), 40, 125);
            doc.text(new Date(data.endDate).toLocaleDateString(), 140, 125);

            // Footer
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text(`Reference ID: ${data.id}`, 105, 280, null, null, "center");

            doc.save(`GatePass_${data.rollNumber}.pdf`);
        };
    </script>
</body>
</html>
