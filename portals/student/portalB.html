<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Status | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <style>
        .step-line { position: absolute; left: 15px; top: 35px; bottom: -10px; width: 2px; background: #e2e8f0; z-index: 0; }
        .step-active .step-line { background: #2563eb; }
        .step-last .step-line { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex overflow-hidden">

    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white z-50 flex flex-col shadow-xl">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center gap-2">
                <i class="fas fa-user-graduate text-blue-500"></i>
                <span class="font-bold text-lg tracking-wider">STUDENT</span>
            </div>
        </div>
        
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-600 to-blue-800 text-white flex items-center justify-center font-bold text-xl shadow-md border border-blue-500/30">
                    <span id="initials">A</span>
                </div>
                <div class="overflow-hidden">
                    <h4 class="text-sm font-bold text-slate-100 truncate w-32" id="display-name">Arjun</h4>
                    <p class="text-xs text-slate-400 font-mono truncate" id="display-id">24331A4200</p>
                </div>
            </div>
            
            <div class="mt-4 bg-slate-800 rounded-lg p-3 flex justify-between items-center border border-slate-700">
                <span class="text-xs text-slate-400 font-bold uppercase">Attendance</span>
                <span class="text-sm font-black text-green-400" id="attendance-display">80%</span>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="portalA.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-paper-plane w-4"></i> New Request
            </a>
            <a href="portalB.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-900/20 transition">
                <i class="fas fa-history w-4"></i> Track Status
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full py-2 flex items-center justify-center gap-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition text-sm font-bold">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full ml-64 overflow-y-auto p-8 bg-slate-100">
        
        <h1 class="text-2xl font-bold text-slate-800 mb-6">Request History</h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div id="active-container" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-900 p-6 text-white flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold" id="status-header">Processing</h2>
                        <p class="text-slate-400 text-xs mt-1 font-mono" id="ref-id">REF: ...</p>
                    </div>
                    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center border border-white/10">
                        <i class="fas fa-sync-alt fa-spin"></i>
                    </div>
                </div>

                <div class="p-8">
                    <div class="space-y-0 relative" id="tracker-steps">
                        <div class="relative pl-12 pb-8" id="step-teacher">
                            <div class="step-line"></div>
                            <div class="absolute left-0 top-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs z-10 border-2 bg-slate-100 border-slate-200 text-slate-400" id="icon-teacher">
                                <i class="fas fa-chalkboard-teacher"></i>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">Class Teacher</h4>
                            <p class="text-xs text-slate-500 mt-0.5 status-text">Pending review...</p>
                        </div>

                        <div class="relative pl-12 pb-8 hidden" id="step-hod">
                            <div class="step-line"></div>
                            <div class="absolute left-0 top-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs z-10 border-2 bg-slate-100 border-slate-200 text-slate-400" id="icon-hod">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">HOD Authorization</h4>
                            <p class="text-xs text-slate-500 mt-0.5 status-text">Required for >2 days</p>
                        </div>

                        <div class="relative pl-12 step-last" id="step-final">
                            <div class="absolute left-0 top-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs z-10 border-2 bg-slate-100 border-slate-200 text-slate-400" id="icon-final">
                                <i class="fas fa-flag-checkered"></i>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">Final Decision</h4>
                            <p class="text-xs text-slate-500 mt-0.5 status-text">Waiting...</p>
                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-100" id="action-area">
                        </div>
                </div>
            </div>

            <div class="space-y-4" id="history-list">
                <div class="text-center py-10 text-slate-400">Loading history...</div>
            </div>
        </div>
    </main>

    <script type="module" src="../../assets/js/permission-pdf.js"></script>
    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        let currentPassData = null;
        window.currentPassData = null;

        auth.onAuthStateChanged(user => {
            console.log('auth.onAuthStateChanged ->', user);
            if (user) loadHistory(user.uid);
            else location.href = '../../public/login.html';
        });

        function loadHistory(uid) {
            console.log('loadHistory uid=', uid);
            db.collection('permissions')
                .where('student.uid', '==', uid)
                .onSnapshot(snap => {
                    console.log('permissions snapshot:', snap.empty, snap.size, snap.docs.map(d => ({ id: d.id, data: d.data() }))); 
                    const list = document.getElementById('history-list');
                    list.innerHTML = '';
                    
                    if (snap.empty) {
                        list.innerHTML = `<div class="p-8 text-center bg-white rounded-xl border border-slate-200 text-slate-400">No requests found.</div>`;
                        document.getElementById('active-container').classList.add('hidden');
                        return;
                    }

                    // Sort docs client-side by creation date (from logs)
                    const allRequests = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    allRequests.sort((a, b) => new Date(b.logs[0].at) - new Date(a.logs[0].at));

                    const latest = allRequests[0];
                    
                    document.getElementById('active-container').classList.remove('hidden');
                    updateTracker(latest);

                    allRequests.forEach(req => { 
                        list.appendChild(createHistoryRow(req)); 
                    });
                }, err => {
                    console.error('onSnapshot error for permissions:', err);
                    const list = document.getElementById('history-list');
                    list.innerHTML = `<div class="p-8 text-center bg-white rounded-xl border border-red-200 text-red-600">Error loading history</div>`;
                });
        }

        const ICONS = {
            'TEACHER': 'fa-chalkboard-teacher',
            'HOD': 'fa-user-tie',
            'COUNSELLOR': 'fa-heartbeat',
            'PRINCIPAL': 'fa-school'
        };
        const TITLES = {
            'TEACHER': 'Class Teacher',
            'HOD': 'HOD Authorization',
            'COUNSELLOR': 'Wellness Team Review',
            'PRINCIPAL': 'Principal Approval'
        };

        function updateTracker(data) {
            currentPassData = data;
            window.currentPassData = data;
            document.getElementById('ref-id').innerText = `ID: ${data.id.slice(0,8).toUpperCase()}`;
            
            const status = data.status;
            const routingPath = data.routingPath || ['TEACHER'];
            const trackerSteps = document.getElementById('tracker-steps');
            trackerSteps.innerHTML = ''; // Clear existing steps

            // Determine how many steps are completed based on status
            // This is more robust than a simple counter. It finds the index of the next step in the path.
            let completedSteps = 0;
            if (status.startsWith('PENDING_')) {
                const nextRole = status.replace('PENDING_', '');
                const nextRoleIndex = routingPath.indexOf(nextRole);
                // If the next role is found in the path, all previous steps are considered complete.
                if (nextRoleIndex !== -1) {
                    completedSteps = nextRoleIndex;
                }
            } else if (status === 'APPROVED' || status === 'REJECTED') {
                completedSteps = routingPath.length;
            }

            // Generate steps from routingPath
            routingPath.forEach((role, index) => {
                const isDone = index < completedSteps;
                const isActive = index === completedSteps && !['APPROVED', 'REJECTED'].includes(status);
                
                let state = 'pending';
                let text = 'Waiting...';
                if (isDone) {
                    state = 'done';
                    text = 'Verified';
                }
                if (isActive) {
                    state = 'active';
                    text = 'Under Review';
                }

                // Never mark routing path steps as last—FINAL is the actual last step
                trackerSteps.innerHTML += createStepHTML(role, state, text, false);
            });

            // Final Logic
            let finalState = 'waiting';
            let finalText = 'Awaiting final decision';
            if (status === 'APPROVED') {
                finalState = 'done';
                finalText = `Approved on ${new Date(data.logs[data.logs.length - 1].at).toLocaleDateString()}`;
            } else if (status === 'REJECTED') {
                finalState = 'error';
                finalText = `Rejected on ${new Date(data.logs[data.logs.length - 1].at).toLocaleDateString()}`;
            }
            // FINAL is the only step marked as last, so step-line shows for all routing steps
            trackerSteps.innerHTML += createStepHTML('FINAL', finalState, finalText, true);

            const actionArea = document.getElementById('action-area');
            if (status === 'APPROVED') {
                actionArea.innerHTML = `<button onclick="window.generateOfficialPDF('${data.id}', window.currentPassData)" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold shadow-lg hover:bg-blue-700 transition flex items-center justify-center gap-2"><i class="fas fa-file-pdf"></i> Download Pass</button>`;
            } else if (status === 'REJECTED') {
                actionArea.innerHTML = `<div class="p-3 bg-red-50 text-red-600 rounded-lg text-sm text-center font-bold">Request was rejected.</div>`;
            } else {
                actionArea.innerHTML = `<div class="p-3 bg-blue-50 text-blue-600 rounded-lg text-sm text-center font-bold">In Progress</div>`;
            }
        }

        function createStepHTML(role, state, text, isLast = false) {
            const icon = role === 'FINAL' ? 'fa-flag-checkered' : (ICONS[role] || 'fa-question');
            const title = role === 'FINAL' ? 'Final Decision' : (TITLES[role] || 'Unknown Step');

            let iconClass = 'bg-slate-100 border-slate-200 text-slate-400';
            let iconContent = `<i class="fas ${icon}"></i>`;
            let lineClass = '';

            if (state === 'done') {
                iconClass = 'bg-green-100 border-green-200 text-green-600';
                iconContent = '<i class="fas fa-check"></i>';
                lineClass = 'step-active';
            } else if (state === 'active') {
                iconClass = 'bg-blue-600 border-blue-600 text-white shadow-lg';
                iconContent = '<i class="fas fa-circle-notch fa-spin"></i>';
                lineClass = 'step-active';
            } else if (state === 'error') {
                iconClass = 'bg-red-100 border-red-200 text-red-600';
                iconContent = '<i class="fas fa-times"></i>';
            }

            const lastClass = isLast ? 'step-last' : '';

            return `
                <div class="relative pl-12 pb-8 ${lastClass} ${lineClass}">
                    <div class="step-line"></div>
                    <div class="absolute left-0 top-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs z-10 border-2 ${iconClass}">
                        ${iconContent}
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm">${title}</h4>
                    <p class="text-xs text-slate-500 mt-0.5 status-text">${text}</p>
                </div>
            `;
        }

        function createHistoryRow(data) {
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-blue-300 transition cursor-pointer flex justify-between items-center";
            
            let badgeClass = 'bg-slate-100 text-slate-600';
            if (data.status === 'APPROVED') badgeClass = 'bg-green-100 text-green-700';
            if (data.status === 'REJECTED') badgeClass = 'bg-red-100 text-red-700';
            if (data.status.includes('PENDING')) badgeClass = 'bg-blue-50 text-blue-700';

            const creationDate = data.logs && data.logs.length > 0 ? new Date(data.logs[0].at).toLocaleDateString() : 'N/A';

            div.innerHTML = `
                <div>
                    <h4 class="font-bold text-slate-800 text-sm">${data.type}</h4>
                    <p class="text-xs text-slate-500">${creationDate}</p>
                </div>
                <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${badgeClass}">${data.status.replace('_', ' ')}</span>
            `;
            div.onclick = () => updateTracker(data);
            return div;
        }

        document.getElementById('logout-btn').onclick = () => auth.signOut().then(() => location.href = '../../public/login.html');
    </script>
</body>
</html>
