<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Request | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 600: '#2563eb', 900: '#1e3a8a' } },
                    boxShadow: { 'glow': '0 0 20px rgba(37, 99, 235, 0.15)' }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen pb-24">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                 <button id="logout-btn-mobile" class="md:hidden text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-power-off text-lg"></i>
                </button>
                <div>
                    <h1 class="font-bold text-xl text-slate-800 tracking-tight">New Request</h1>
                    <p class="text-[10px] font-bold text-brand-600 uppercase tracking-wider">Gate Pass Application</p>
                </div>
            </div>
            <button id="logout-btn" class="hidden md:flex items-center gap-2 text-slate-500 hover:text-red-600 font-bold text-xs uppercase tracking-widest transition-colors">
                <span>Logout</span>
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 sm:p-6 space-y-6">
        <div id="blocked-screen" class="hidden text-center py-12">
            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500 text-4xl">
                <i class="fas fa-ban"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Account Suspended</h2>
            <p class="text-gray-500 mt-2">Access revoked. Please report to the HOD.</p>
        </div>

        <div id="active-screen">
            <div class="glass-panel p-5 rounded-2xl flex items-center gap-4 shadow-sm mb-6">
                <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg" id="avatar">S</div>
                <div>
                    <h3 class="font-bold text-slate-800" id="student-name">Loading...</h3>
                    <p class="text-xs text-slate-500 font-mono" id="roll-no">...</p>
                    <input type="hidden" id="dept-hidden">
                </div>
            </div>

            <form id="request-form" class="space-y-5">
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="reasonType" value="Medical" class="peer hidden" required>
                        <div class="p-4 rounded-xl bg-white border border-slate-200 text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition">
                            <i class="fas fa-heartbeat mb-1"></i><span class="block text-[10px] font-bold uppercase">Medical</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="reasonType" value="Personal" class="peer hidden">
                        <div class="p-4 rounded-xl bg-white border border-slate-200 text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition">
                            <i class="fas fa-home mb-1"></i><span class="block text-[10px] font-bold uppercase">Personal</span>
                        </div>
                    </label>
                </div>

                <div class="space-y-4">
                    <input type="date" id="startDate" required class="w-full p-4 bg-white border border-slate-200 rounded-xl outline-none focus:ring-1 focus:ring-brand-600 font-bold text-sm">
                    <input type="date" id="endDate" required class="w-full p-4 bg-white border border-slate-200 rounded-xl outline-none focus:ring-1 focus:ring-brand-600 font-bold text-sm">
                </div>

                <div id="hod-alert" class="hidden bg-purple-50 border border-purple-100 p-4 rounded-xl text-[11px] text-purple-600">
                    <i class="fas fa-info-circle mr-1"></i> Requests exceeding 2 days require HOD authorization.
                </div>

                <textarea id="reason" required rows="3" placeholder="Enter specific reason..." class="w-full p-4 bg-white border border-slate-200 rounded-xl outline-none focus:ring-1 focus:ring-brand-600 text-sm"></textarea>

                <button type="submit" id="submit-btn" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-xl hover:bg-brand-600 transition active:scale-95">
                    Submit Request
                </button>
            </form>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe z-40">
        <div class="max-w-md mx-auto grid grid-cols-3 h-20">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-brand-600">
                <i class="fas fa-plus-circle text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Request</span>
            </a>
            <a href="lab.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600">
                <i class="fas fa-flask text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Lab</span>
            </a>
            <a href="portalB.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600">
                <i class="fas fa-history text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">History</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        const logout = async () => {
            if(confirm("Logout from UNI-PASS?")) {
                sessionStorage.clear();
                await auth.signOut();
                location.href = '../../public/login.html';
            }
        };
        document.getElementById('logout-btn').onclick = logout;
        document.getElementById('logout-btn-mobile').onclick = logout;

        auth.onAuthStateChanged(async user => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.isBlocked) {
                        document.getElementById('active-screen').classList.add('hidden');
                        document.getElementById('blocked-screen').classList.remove('hidden');
                        return;
                    }
                    document.getElementById('student-name').innerText = data.displayName;
                    document.getElementById('roll-no').innerText = data.rollNumber;
                    document.getElementById('dept-hidden').value = data.department;
                }
            } else location.href = '../../public/login.html';
        });

        // Date Duration Alert Logic
        const startInput = document.getElementById('startDate');
        const endInput = document.getElementById('endDate');
        const alertBox = document.getElementById('hod-alert');
        
        [startInput, endInput].forEach(input => input.addEventListener('change', () => {
            if(startInput.value && endInput.value) {
                const diff = (new Date(endInput.value) - new Date(startInput.value)) / (1000 * 60 * 60 * 24);
                if (diff > 2) alertBox.classList.remove('hidden');
                else alertBox.classList.add('hidden');
            }
        }));

        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            try {
                await db.collection('permissions').add({
                    studentID: auth.currentUser.uid,
                    studentName: document.getElementById('student-name').innerText,
                    rollNumber: document.getElementById('roll-no').innerText,
                    department: document.getElementById('dept-hidden').value,
                    reasonType: document.querySelector('input[name="reasonType"]:checked').value,
                    reason: document.getElementById('reason').value,
                    startDate: startInput.value,
                    endDate: endInput.value,
                    status: 'PENDING_TEACHER',
                    timestamp: new Date().toISOString()
                });
                location.href = 'portalB.html';
            } catch (err) { alert(err.message); btn.disabled = false; }
        });
    </script>
</body>
</html>
