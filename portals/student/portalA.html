<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Permission | UNI-PASS Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <style>
        input[type="radio"]:checked + div { background-color: #eff6ff; border-color: #3b82f6; border-width: 2px; color: #1e3a8a; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1); }
        .reason-box { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col pb-20 md:pb-0">

    <nav class="bg-white shadow-sm z-50 sticky top-0">
        <div class="max-w-3xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-university text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight text-gray-900">UNI-PASS</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="portalB.html" class="hidden md:flex text-sm font-bold text-gray-500 hover:text-blue-600 transition items-center gap-2">
                        <i class="fas fa-history"></i> History
                    </a>
                    <button id="logout-btn" class="flex items-center gap-2 bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-red-600 hover:text-white transition-all active:scale-95">
                        <i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6" id="main-content">
        <div id="blocked-screen" class="hidden text-center py-12">
            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500 text-4xl">
                <i class="fas fa-ban"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Account Suspended</h2>
            <p class="text-gray-500 mt-2 max-w-md mx-auto">Your access has been revoked by a faculty member. Please report to the HOD office.</p>
        </div>

        <div id="active-screen">
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 flex items-center gap-4 border border-gray-100">
                <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center text-xl text-blue-600 font-bold">
                    <span id="initials">U</span>
                </div>
                <div>
                    <h3 class="font-bold text-lg text-gray-900 leading-tight" id="display-name">Loading...</h3>
                    <p class="text-sm text-gray-500 font-mono" id="display-id">...</p>
                </div>
                <div class="ml-auto text-right">
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Attendance</p>
                    <p class="text-xl font-black text-green-600" id="attendance-display">--%</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
                <div class="bg-blue-600 p-4">
                    <h2 class="text-white font-bold text-lg flex items-center gap-2">
                        <i class="fas fa-paper-plane"></i> New Request
                    </h2>
                    <div class="w-full bg-blue-900/30 h-1.5 mt-3 rounded-full overflow-hidden">
                        <div class="bg-white h-full transition-all duration-300 w-5" id="form-progress"></div>
                    </div>
                </div>

                <form id="request-form" class="p-6 space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Select Category</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <label class="cursor-pointer group">
                                <input type="radio" name="reasonType" value="Medical" class="peer sr-only">
                                <div class="reason-box p-3 border border-gray-200 rounded-xl hover:bg-gray-50 text-center">
                                    <div class="text-xl mb-1">💊</div>
                                    <span class="font-bold text-xs">Medical</span>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="radio" name="reasonType" value="Personal" class="peer sr-only">
                                <div class="reason-box p-3 border border-gray-200 rounded-xl hover:bg-gray-50 text-center">
                                    <div class="text-xl mb-1">🏠</div>
                                    <span class="font-bold text-xs">Personal</span>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="radio" name="reasonType" value="On-Duty" class="peer sr-only">
                                <div class="reason-box p-3 border border-gray-200 rounded-xl hover:bg-gray-50 text-center">
                                    <div class="text-xl mb-1">🎓</div>
                                    <span class="font-bold text-xs">On-Duty</span>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="radio" name="reasonType" value="Other" class="peer sr-only">
                                <div class="reason-box p-3 border border-gray-200 rounded-xl hover:bg-gray-50 text-center">
                                    <div class="text-xl mb-1">⚡</div>
                                    <span class="font-bold text-xs">Other</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">From Date</label>
                            <input type="text" id="start-date" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium" placeholder="Select...">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">To Date</label>
                            <input type="text" id="end-date" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium" placeholder="Select...">
                        </div>
                    </div>

                    <div id="duration-feedback" class="hidden bg-blue-50 text-blue-800 p-3 rounded-lg text-sm flex items-center justify-between border border-blue-100">
                        <span class="font-medium"><i class="fas fa-clock mr-2"></i> Duration: <strong id="day-count">0</strong> Days</span>
                        <span id="escalation-warning" class="hidden bg-orange-100 text-orange-700 text-xs font-bold px-2 py-1 rounded border border-orange-200">
                            <i class="fas fa-arrow-up"></i> Requires HOD
                        </span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Detailed Reason</label>
                        <textarea id="custom-reason" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm transition resize-none" placeholder="Describe why you need this..."></textarea>
                    </div>

                    <button type="submit" id="submit-btn" disabled class="w-full bg-gray-200 text-gray-400 font-bold py-4 rounded-xl transition-all shadow-none text-lg cursor-not-allowed">
                        Fill details to Proceed
                    </button>
                </form>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 md:hidden z-40">
        <div class="grid grid-cols-2 h-16">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-blue-600">
                <i class="fas fa-plus-circle text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">Request</span>
            </a>
            <a href="portalB.html" class="flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 transition">
                <i class="fas fa-history text-xl"></i>
                <span class="text-[10px] font-bold uppercase mt-1">History</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        // --- AUTH & PROFILE ---
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = '../../public/login.html'; return; }
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.isBlocked) {
                        document.getElementById('active-screen').classList.add('hidden');
                        document.getElementById('blocked-screen').classList.remove('hidden');
                        return;
                    }
                    document.getElementById('display-name').innerText = data.displayName;
                    document.getElementById('display-id').innerText = data.rollNumber || user.email;
                    document.getElementById('initials').innerText = (data.displayName || 'U').charAt(0);
                    document.getElementById('attendance-display').innerText = `${data.attendance || 0}%`;
                }
            } catch (err) { console.error(err); }
        });

        // --- LOGOUT LOGIC ---
        document.getElementById('logout-btn').onclick = async () => {
            if (confirm("Sign out of UNI-PASS?")) {
                sessionStorage.clear();
                localStorage.clear();
                await auth.signOut();
                window.location.href = '../../public/login.html';
            }
        };

        // UI functionality for form remains exactly as you provided...
        // (Flatpickr init, updateFormState, submit event)
    </script>
</body>
</html>
