<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Request | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 600: '#2563eb', 900: '#1e3a8a' } },
                    boxShadow: { 'glow': '0 0 20px rgba(37, 99, 235, 0.15)' }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .input-group:focus-within label { color: #2563eb; }
        .input-group:focus-within i { color: #2563eb; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen pb-24">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                 <div class="md:hidden">
                    <button id="logout-btn-mobile" class="text-slate-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-800 tracking-tight">New Request</h1>
                    <p class="text-[10px] font-bold text-brand-600 uppercase tracking-wider">Gate Pass Application</p>
                </div>
            </div>
            <button id="logout-btn" class="hidden md:flex items-center gap-2 text-slate-500 hover:text-red-600 font-bold text-xs transition-colors uppercase tracking-widest">
                <span>Logout</span>
                <i class="fas fa-sign-out-alt"></i>
            </button>
            <div class="md:hidden w-10 h-10 bg-brand-50 rounded-full flex items-center justify-center text-brand-600 shadow-sm">
                <i class="fas fa-plus"></i>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 sm:p-6 space-y-6">

        <div class="glass-panel p-5 rounded-2xl flex items-center gap-4 shadow-sm">
            <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 font-bold text-lg" id="avatar">
                <i class="fas fa-user"></i>
            </div>
            <div>
                <h3 class="font-bold text-slate-800" id="student-name">Loading...</h3>
                <p class="text-xs text-slate-500 font-mono" id="roll-no">...</p>
                <input type="hidden" id="dept-hidden">
            </div>
        </div>

        <form id="request-form" class="space-y-5">
            <div class="space-y-3">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Reason Category</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="reasonType" value="Medical" class="peer hidden" required>
                        <div class="p-4 rounded-xl bg-white border border-slate-200 text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition hover:shadow-md">
                            <i class="fas fa-heartbeat text-xl mb-2"></i>
                            <span class="block text-xs font-bold">Medical</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="reasonType" value="Academic" class="peer hidden">
                        <div class="p-4 rounded-xl bg-white border border-slate-200 text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition hover:shadow-md">
                            <i class="fas fa-graduation-cap text-xl mb-2"></i>
                            <span class="block text-xs font-bold">Academic</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="reasonType" value="Personal" class="peer hidden">
                        <div class="p-4 rounded-xl bg-white border border-slate-200 text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition hover:shadow-md">
                            <i class="fas fa-home text-xl mb-2"></i>
                            <span class="block text-xs font-bold">Personal</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="reasonType" value="Outing" class="peer hidden">
                        <div class="p-4 rounded-xl bg-white border border-slate-200 text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-600 transition hover:shadow-md">
                            <i class="fas fa-walking text-xl mb-2"></i>
                            <span class="block text-xs font-bold">Outing</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block transition-colors">From Date</label>
                    <div class="relative">
                        <i class="fas fa-calendar absolute left-3 top-3.5 text-slate-300 transition-colors"></i>
                        <input type="date" id="startDate" required class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:border-brand-600 focus:ring-1 focus:ring-brand-600 outline-none text-sm font-bold text-slate-700 transition">
                    </div>
                </div>
                <div class="input-group">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block transition-colors">To Date</label>
                    <div class="relative">
                        <i class="fas fa-calendar absolute left-3 top-3.5 text-slate-300 transition-colors"></i>
                        <input type="date" id="endDate" required class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:border-brand-600 focus:ring-1 focus:ring-brand-600 outline-none text-sm font-bold text-slate-700 transition">
                    </div>
                </div>
            </div>

            <div id="hod-alert" class="hidden bg-purple-50 border border-purple-100 p-4 rounded-xl flex items-start gap-3">
                <i class="fas fa-info-circle text-purple-600 mt-0.5"></i>
                <div>
                    <h4 class="text-xs font-bold text-purple-700 uppercase">HOD Approval Required</h4>
                    <p class="text-[11px] text-purple-600 leading-tight mt-1">Requests exceeding 2 days require authorization from the Head of Department.</p>
                </div>
            </div>

            <div class="input-group">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block transition-colors">Specific Reason</label>
                <textarea id="reason" required rows="3" placeholder="E.g., Visiting doctor..." class="w-full p-4 bg-white border border-slate-200 rounded-xl focus:border-brand-600 focus:ring-1 focus:ring-brand-600 outline-none text-sm transition"></textarea>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-xl shadow-slate-200 hover:bg-brand-600 hover:shadow-brand-600/30 transition-all transform active:scale-95 flex items-center justify-center gap-2 group">
                <span>Submit Application</span>
                <i class="fas fa-paper-plane group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe z-40">
        <div class="max-w-md mx-auto grid grid-cols-4 h-20">
            <a href="portalA.html" class="flex flex-col items-center justify-center text-brand-600">
                <i class="fas fa-plus-circle text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Request</span>
            </a>
            <a href="lab.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600 transition">
                <i class="fas fa-flask text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Lab</span>
            </a>
            <a href="portalC.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600 transition">
                <i class="fas fa-book text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Resources</span>
            </a>
            <a href="portalB.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-brand-600 transition">
                <i class="fas fa-history text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase">History</span>
            </a>
        </div>
    </nav>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        // --- LOGOUT LOGIC ---
        const handleLogout = async () => {
            if(confirm("Are you sure you want to logout?")) {
                sessionStorage.clear();
                await auth.signOut();
                location.href = '../../public/login.html';
            }
        };
        document.getElementById('logout-btn').onclick = handleLogout;
        document.getElementById('logout-btn-mobile').onclick = handleLogout;

        let currentUser = null;
        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('student-name').innerText = data.displayName || "Student";
                    document.getElementById('roll-no').innerText = data.rollNumber || "No Roll Number";
                    document.getElementById('dept-hidden').value = data.department || "";
                    document.getElementById('avatar').innerText = (data.displayName || "S").charAt(0);
                }
            } else {
                location.href = '../../public/login.html';
            }
        });

        // Date Logic and Submit Logic remains exactly as original...
        const startInput = document.getElementById('startDate');
        const endInput = document.getElementById('endDate');
        const alertBox = document.getElementById('hod-alert');
        const today = new Date().toISOString().split('T')[0];
        startInput.min = today;
        endInput.min = today;

        function checkDuration() {
            if(startInput.value && endInput.value) {
                const s = new Date(startInput.value);
                const e = new Date(endInput.value);
                if (e < s) endInput.value = startInput.value;
                const diff = (e - s) / (1000 * 60 * 60 * 24);
                if (diff > 2) alertBox.classList.remove('hidden');
                else alertBox.classList.add('hidden');
            }
        }
        startInput.addEventListener('change', checkDuration);
        endInput.addEventListener('change', checkDuration);

        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';

            try {
                const formData = {
                    studentID: currentUser.uid,
                    studentName: document.getElementById('student-name').innerText,
                    studentEmail: currentUser.email,
                    rollNumber: document.getElementById('roll-no').innerText,
                    department: document.getElementById('dept-hidden').value,
                    reasonType: document.querySelector('input[name="reasonType"]:checked').value,
                    reason: document.getElementById('reason').value,
                    startDate: startInput.value,
                    endDate: endInput.value,
                    status: 'PENDING_TEACHER',
                    timestamp: new Date().toISOString(),
                    approvals: {},
                    workflowHistory: [{ step: 'SUBMITTED', timestamp: new Date().toISOString() }]
                };
                await db.collection('permissions').add(formData);
                btn.className = "w-full py-4 bg-green-600 text-white rounded-xl font-bold shadow-xl flex items-center justify-center gap-2";
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Sent Successfully!';
                setTimeout(() => { location.href = 'portalB.html'; }, 1500);
            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        });
    </script>
</body>
</html>
