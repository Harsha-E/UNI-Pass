<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Dashboard | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center text-white">
                        <i class="fas fa-flask"></i>
                    </div>
                    <span class="font-bold text-xl text-gray-800">Lab Manager</span>
                </div>
                <div class="flex items-center">
                    <button id="logout-btn" class="text-sm font-bold text-red-500 hover:text-red-700">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-10 px-4">
        
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Inventory Management</h1>
            <p class="text-gray-500">Upload stock data or manage existing items.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 mb-8">
            <div class="flex items-start gap-4">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-xl shrink-0">
                    <i class="fas fa-file-csv"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-900">Bulk Import Inventory</h3>
                    <p class="text-sm text-gray-500 mb-4">
                        Upload a CSV file with columns: <br>
                        <code class="bg-gray-100 px-1 py-0.5 rounded text-xs">itemId, itemName, category, quantity, unit, location, status</code>
                    </p>

                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-400 transition bg-gray-50 relative">
                        <input type="file" id="csv-input" accept=".csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="space-y-2">
                            <i class="fas fa-cloud-upload-alt text-3xl text-gray-400"></i>
                            <p class="text-sm font-bold text-gray-600">Click to choose CSV file</p>
                            <p class="text-xs text-gray-400" id="file-name">No file selected</p>
                        </div>
                    </div>

                    <div id="progress-container" class="hidden mt-4">
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                            <span id="progress-text">Uploading...</span>
                            <span id="progress-percent">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div id="progress-bar" class="bg-green-600 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>

                    <div id="status-msg" class="mt-4 text-sm font-bold hidden"></div>

                    <button id="upload-btn" disabled class="mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        Start Import
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        const fileInput = document.getElementById('csv-input');
        const fileNameDisplay = document.getElementById('file-name');
        const uploadBtn = document.getElementById('upload-btn');
        const statusMsg = document.getElementById('status-msg');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');

        // 1. Handle File Selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.innerText = file.name;
                uploadBtn.disabled = false;
                statusMsg.classList.add('hidden');
            } else {
                fileNameDisplay.innerText = "No file selected";
                uploadBtn.disabled = true;
            }
        });

        // 2. Handle Upload
        uploadBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = async (e) => {
                const text = e.target.result;
                await processCSV(text);
            };
            
            reader.readAsText(file);
        });

        // 3. Process Logic
        async function processCSV(csvText) {
            // UI Reset
            uploadBtn.disabled = true;
            uploadBtn.innerText = "Processing...";
            progressContainer.classList.remove('hidden');
            statusMsg.classList.add('hidden');

            const lines = csvText.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            // Validate Headers (Basic Check)
            if (!headers.includes('itemId') || !headers.includes('itemName')) {
                showStatus("❌ Invalid CSV Format. Missing 'itemId' or 'itemName'.", "text-red-600");
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Start Import";
                progressContainer.classList.add('hidden');
                return;
            }

            const total = lines.length - 1; // Exclude header
            let count = 0;
            let batch = db.batch();
            let batchCount = 0;

            try {
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const values = line.split(',');
                    const item = {};

                    // Map values to headers dynamically
                    headers.forEach((header, index) => {
                        let val = values[index] ? values[index].trim() : "";
                        // Convert quantity to number
                        if (header === 'quantity') val = parseInt(val) || 0;
                        item[header] = val;
                    });

                    // Add to Batch
                    if (item.itemId) {
                        const ref = db.collection('inventory').doc(item.itemId);
                        batch.set(ref, item);
                        batchCount++;
                        count++;
                    }

                    // Firestore Batch limit is 500
                    if (batchCount >= 400) {
                        await batch.commit();
                        batch = db.batch();
                        batchCount = 0;
                        updateProgress(count, total);
                    }
                }

                // Commit remaining
                if (batchCount > 0) {
                    await batch.commit();
                }

                updateProgress(total, total);
                showStatus(`✅ Success! Imported ${count} items.`, "text-green-600");
                
                // Clear input after success
                setTimeout(() => {
                    fileInput.value = '';
                    fileNameDisplay.innerText = "No file selected";
                    progressContainer.classList.add('hidden');
                    uploadBtn.innerText = "Start Import";
                }, 3000);

            } catch (error) {
                console.error(error);
                showStatus("❌ Error during upload: " + error.message, "text-red-600");
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Start Import";
            }
        }

        function updateProgress(current, total) {
            const pct = Math.round((current / total) * 100) + "%";
            progressBar.style.width = pct;
            progressPercent.innerText = pct;
        }

        function showStatus(msg, colorClass) {
            statusMsg.innerText = msg;
            statusMsg.className = `mt-4 text-sm font-bold ${colorClass}`;
            statusMsg.classList.remove('hidden');
        }

        document.getElementById('logout-btn').onclick = () => {
            auth.signOut().then(() => window.location.href = '../../public/login.html');
        };
    </script>
</body>
</html>
