<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Dashboard | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/ui.js" defer></script>
    <script type="module" src="../../assets/js/route-guard.js"></script>
</head>
<body class="bg-gray-50 font-sans h-screen flex overflow-hidden">

    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-gray-900/50 z-20 hidden md:hidden glass"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-30 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 shadow-2xl">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-800 bg-slate-950">
            <span class="font-bold text-lg tracking-wider text-slate-100">LAB ASSIST</span>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchView('requests')" id="nav-requests" class="w-full flex items-center px-4 py-3 bg-blue-600 text-white rounded-xl shadow-lg transition">
                <i class="fas fa-inbox w-5 mr-3"></i> Requests
                <span id="badge-req" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </button>
            <button onclick="switchView('inventory')" id="nav-inventory" class="w-full flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl transition">
                <i class="fas fa-boxes w-5 mr-3"></i> Inventory
            </button>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full py-3 text-slate-400 hover:text-red-400 text-sm font-bold flex items-center justify-center gap-2 bg-slate-800 rounded-lg md:bg-transparent">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
        
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 md:px-8 border-b border-gray-200 z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-blue-600 p-2">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h2 class="text-lg md:text-xl font-bold text-gray-800 truncate" id="page-title">Incoming Requests</h2>
            </div>
            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 border border-blue-100">
                <i class="fas fa-flask"></i>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 bg-gray-50" id="main-scroll">
            
            <div id="view-requests" class="animate-fade-in max-w-3xl mx-auto w-full">
                <div id="requests-feed" class="space-y-3">
                    <div class="text-center py-12 text-gray-400 flex flex-col items-center">
                        <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i> Loading...
                    </div>
                </div>
            </div>

            <div id="view-inventory" class="hidden animate-fade-in space-y-6 max-w-5xl mx-auto w-full">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-800 mb-3 text-sm uppercase tracking-wide">Add Item</h3>
                        <form id="add-form" class="space-y-3">
                            <input type="text" id="inv-name" placeholder="Item Name (e.g. Sulphuric Acid)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                            <div class="flex gap-3">
                                <select id="inv-dept" class="w-1/2 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none">
                                    <option>Chemistry</option><option>Physics</option><option>EEE</option><option>CSE</option>
                                </select>
                                <input type="number" id="inv-qty" placeholder="Qty" class="w-1/2 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none" required>
                            </div>
                            <input type="text" id="inv-loc" placeholder="Location (e.g. Rack 4B)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none">
                            <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-slate-800 shadow-lg active:scale-95 transition">Add to Stock</button>
                        </form>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-center items-center text-center">
                        <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mb-2">
                            <i class="fas fa-file-csv text-green-600 text-xl"></i>
                        </div>
                        <h3 class="font-bold text-gray-800 text-sm">Bulk Import</h3>
                        <p class="text-xs text-gray-400 mb-4 max-w-[200px]">Format: name, department, quantity, location</p>
                        
                        <input type="file" id="csv-upload" accept=".csv" class="hidden">
                        <label for="csv-upload" class="w-full max-w-xs bg-gray-100 hover:bg-gray-200 text-gray-600 py-3 rounded-xl cursor-pointer font-bold text-sm transition border border-gray-200 border-dashed">
                            Choose CSV File
                        </label>
                        <p id="upload-msg" class="text-xs mt-2 h-4 font-bold text-green-600"></p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <span class="font-bold text-gray-700 text-sm">Current Stock</span>
                        <span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-md font-mono" id="stock-count">0 Items</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-100 text-gray-500 font-bold uppercase text-[10px] tracking-wider">
                                <tr>
                                    <th class="px-6 py-3">Item Name</th>
                                    <th class="px-6 py-3">Dept</th>
                                    <th class="px-6 py-3">Qty</th>
                                    <th class="px-6 py-3">Loc</th>
                                    <th class="px-6 py-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-list" class="divide-y divide-gray-100">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { db, auth } from '../../assets/js/firebase-init.js';

        let currentView = 'requests';

        // --- AUTH ---
        auth.onAuthStateChanged(async user => {
            if(!user) location.href = '../../public/login.html';
            // Verify Role
            const doc = await db.collection('users').doc(user.uid).get();
            if(!doc.exists || doc.data().role !== 'lab_assistant') {
                alert("Access Denied: Lab Assistants Only.");
                location.href = '../../public/login.html';
                return;
            }
            // Init
            loadRequests();
            loadInventory();
        });

        // --- UI ---
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('mobile-overlay');
            const isClosed = sb.classList.contains('-translate-x-full');
            
            if(isClosed) {
                sb.classList.remove('-translate-x-full');
                ov.classList.remove('hidden');
            } else {
                sb.classList.add('-translate-x-full');
                ov.classList.add('hidden');
            }
        };

        window.switchView = (view) => {
            // Close sidebar on mobile when clicking a link
            if(window.innerWidth < 768) window.toggleSidebar();

            document.getElementById('view-requests').classList.add('hidden');
            document.getElementById('view-inventory').classList.add('hidden');
            
            // Reset Tabs
            document.querySelectorAll('aside nav button').forEach(b => {
                b.className = "w-full flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl transition";
            });

            // Set Active
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById(`nav-${view}`).className = "w-full flex items-center px-4 py-3 bg-blue-600 text-white rounded-xl shadow-lg transition";
            
            document.getElementById('page-title').innerText = view === 'requests' ? 'Incoming Requests' : 'Inventory Management';
        };

        // --- REQUESTS LOGIC ---
        function loadRequests() {
            db.collection('lab_requests').where('status', '==', 'PENDING')
                .onSnapshot(snap => {
                    const feed = document.getElementById('requests-feed');
                    const badge = document.getElementById('badge-req');
                    
                    badge.innerText = snap.size;
                    badge.style.display = snap.size > 0 ? 'inline-block' : 'none';
                    feed.innerHTML = '';

                    if(snap.empty) {
                        feed.innerHTML = `
                            <div class="text-center py-12 text-gray-400 bg-white rounded-2xl border border-gray-200 border-dashed">
                                <i class="fas fa-check-circle text-4xl mb-3 text-gray-200"></i>
                                <p>No pending requests.</p>
                            </div>`;
                        return;
                    }

                    snap.forEach(doc => {
                        const d = doc.data();
                        feed.innerHTML += `
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md transition">
                                <div class="flex justify-between items-start mb-3">
                                    <div>
                                        <span class="inline-block px-2 py-0.5 rounded bg-blue-50 text-blue-600 text-[10px] font-bold uppercase mb-1">Item Request</span>
                                        <h4 class="font-bold text-gray-900 text-lg">${d.itemName}</h4>
                                    </div>
                                    <span class="text-xs text-gray-400 font-mono">${new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                </div>
                                <div class="flex items-center gap-2 mb-4 p-2 bg-gray-50 rounded-lg border border-gray-100">
                                    <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-bold text-xs">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <div class="text-xs">
                                        <p class="font-bold text-gray-700">Student ID: ${d.studentId.substring(0,6)}...</p>
                                        <p class="text-gray-500">${d.studentEmail}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="processReq('${doc.id}', '${d.itemId}', 'REJECT')" class="py-2.5 border border-red-200 bg-white text-red-600 rounded-xl text-sm font-bold hover:bg-red-50 transition">Reject</button>
                                    <button onclick="processReq('${doc.id}', '${d.itemId}', 'APPROVE')" class="py-2.5 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-slate-700 shadow-md transition">Issue Item</button>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        window.processReq = async (reqId, itemId, action) => {
            if(!confirm(`Are you sure you want to ${action} this request?`)) return;
            
            try {
                const batch = db.batch();
                const reqRef = db.collection('lab_requests').doc(reqId);
                
                if(action === 'APPROVE') {
                    const itemRef = db.collection('inventory').doc(itemId);
                    // Atomic decrement
                    batch.update(itemRef, { quantity: firebase.firestore.FieldValue.increment(-1) });
                    batch.update(reqRef, { status: 'ISSUED', processedAt: new Date().toISOString() });
                } else {
                    batch.update(reqRef, { status: 'REJECTED', processedAt: new Date().toISOString() });
                }

                await batch.commit();
                // Alert removed for smoother UX, just relies on UI update
            } catch(e) { alert(e.message); }
        };

        // --- INVENTORY LOGIC ---
        function loadInventory() {
            db.collection('inventory').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const list = document.getElementById('inventory-list');
                document.getElementById('stock-count').innerText = `${snap.size} Items`;
                list.innerHTML = '';
                
                snap.forEach(doc => {
                    const d = doc.data();
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50 transition border-b border-gray-100 last:border-0">
                            <td class="px-6 py-3 font-bold text-slate-700">${d.name}</td>
                            <td class="px-6 py-3"><span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-[10px] font-bold uppercase">${d.department}</span></td>
                            <td class="px-6 py-3 font-mono font-bold ${d.quantity < 5 ? 'text-red-500' : 'text-slate-600'}">${d.quantity}</td>
                            <td class="px-6 py-3 text-slate-400 text-xs">${d.location}</td>
                            <td class="px-6 py-3 text-right">
                                <button onclick="delItem('${doc.id}')" class="w-8 h-8 rounded-full hover:bg-red-50 text-red-300 hover:text-red-500 transition flex items-center justify-center ml-auto">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = "Saving...";

            try {
                await db.collection('inventory').add({
                    name: document.getElementById('inv-name').value,
                    department: document.getElementById('inv-dept').value,
                    quantity: parseInt(document.getElementById('inv-qty').value),
                    location: document.getElementById('inv-loc').value,
                    timestamp: new Date().toISOString()
                });
                e.target.reset();
            } catch(err) { alert(err.message); }
            finally { btn.disabled = false; btn.innerText = originalText; }
        });

        window.delItem = async (id) => {
            if(confirm("Permanently remove this item from database?")) {
                await db.collection('inventory').doc(id).delete();
            }
        };

        // CSV Upload Logic
        document.getElementById('csv-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            const msg = document.getElementById('upload-msg');
            msg.innerText = "Parsing...";
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    const batch = db.batch();
                    let count = 0;
                    
                    results.data.forEach(row => {
                        if(row.name && row.quantity) {
                            const ref = db.collection('inventory').doc();
                            batch.set(ref, {
                                name: row.name,
                                department: row.department || 'General',
                                quantity: parseInt(row.quantity),
                                location: row.location || 'N/A',
                                timestamp: new Date().toISOString()
                            });
                            count++;
                        }
                    });

                    if(count > 0) {
                        await batch.commit();
                        msg.innerText = `✅ Added ${count} items`;
                        setTimeout(() => msg.innerText = "", 3000);
                    } else {
                        msg.innerText = "❌ No valid data found";
                    }
                }
            });
        });

        document.getElementById('logout-btn').onclick = () => {
            auth.signOut().then(() => location.href = '../../public/login.html');
        };
    </script>
</body>
</html>
