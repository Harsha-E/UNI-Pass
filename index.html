<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNI-Pass</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // Use a function to ensure tailwind is available before configuring
        function configureTailwind() {
            if (window.tailwind) {
                tailwind.config = {
                    theme: {
                        extend: {
                            colors: {
                                // Add your custom colors here
                                primary: '#1d4ed8',
                            }
                        }
                    }
                }
            } else {
                console.error("Tailwind failed to load. Retrying with mirror...");
                // Fallback mirror if primary CDN fails
                const fallback = document.createElement('script');
                fallback.src = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4";
                document.head.appendChild(fallback);
            }
        }

        // Run configuration
        if (document.readyState === 'complete') {
            configureTailwind();
        } else {
            window.addEventListener('load', configureTailwind);
        }
    </script>

    <style type="text/css">
        /* Fallback styles in case CDN is completely blocked */
        .loading-fallback { display: none; }
    </style>
</head>
<body class="bg-gray-100">
    </body>
</html>
