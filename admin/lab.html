<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Inventory Manager | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="module" src="../assets/js/firebase-init.js"></script>
    <style>
        @media (max-width: 768px) {
            .sidebar-mobile { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .sidebar-mobile.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex overflow-hidden">

    <button id="mobile-toggle" class="md:hidden fixed bottom-6 right-6 z-50 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center text-xl">
        <i class="fas fa-bars"></i>
    </button>

    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 z-40 shadow-xl fixed inset-y-0 left-0 sidebar-mobile md:relative md:translate-x-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <span class="font-bold text-lg tracking-wider text-slate-100">LAB ADMIN</span>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="admin.html" class="w-full flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl transition">
                <i class="fas fa-arrow-left w-5 mr-3"></i> Back to Main
            </a>
            <div class="px-4 text-xs font-bold text-slate-500 uppercase mt-4">Inventory</div>
            <button class="w-full flex items-center px-4 py-3 bg-blue-600 text-white rounded-xl shadow-lg">
                <i class="fas fa-flask w-5 mr-3"></i> Manage Stock
            </button>
        </nav>
        
        <div class="p-4 border-t border-slate-800 bg-slate-900">
            <button id="logout-btn" class="w-full py-2.5 border border-slate-700 text-slate-400 rounded-lg hover:bg-red-600 hover:text-white hover:border-red-600 transition flex items-center justify-center gap-2 text-sm font-bold">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <div id="overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 md:px-8 border-b border-slate-200">
            <h2 class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fas fa-database text-blue-600"></i> <span class="hidden sm:inline">Lab Inventory System</span><span class="sm:hidden">Inventory</span>
            </h2>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50">
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-4"><i class="fas fa-plus-circle text-green-500 mr-2"></i> Add Item</h3>
                    <form id="add-item-form" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" id="item-name" placeholder="Item Name" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                            <select id="item-dept" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                                <option value="Chemistry">Chemistry</option>
                                <option value="Physics">Physics</option>
                                <option value="EEE">EEE</option>
                                <option value="CSE">CSE (IoT)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="number" id="item-qty" placeholder="Quantity" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                            <input type="text" id="item-loc" placeholder="Location" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-2.5 rounded-lg font-bold hover:bg-slate-800 transition active:scale-95 text-sm">Add to Inventory</button>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                    <h3 class="font-bold text-slate-700 mb-2"><i class="fas fa-file-upload text-blue-500 mr-2"></i> Bulk Upload</h3>
                    <p class="text-xs text-slate-500 mb-4 font-medium">CSV Format: <code>name, department, quantity, location</code></p>
                    
                    <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer relative">
                        <input type="file" id="csv-file" accept=".csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <i class="fas fa-cloud-upload-alt text-2xl text-slate-400 mb-2"></i>
                        <p class="text-xs font-bold text-slate-600">Click or Drop CSV</p>
                    </div>
                    <div id="upload-status" class="mt-2 text-[10px] font-bold text-center h-4 uppercase"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center bg-slate-50 gap-4">
                    <h3 class="font-bold text-slate-800">Current Stock</h3>
                    <input type="text" id="search-stock" placeholder="Search inventory..." class="w-full sm:w-64 px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left min-w-[600px]">
                        <thead class="bg-slate-100 text-[10px] uppercase text-slate-500 font-bold">
                            <tr>
                                <th class="px-6 py-3">Item Name</th>
                                <th class="px-6 py-3">Dept</th>
                                <th class="px-6 py-3">Qty</th>
                                <th class="px-6 py-3">Location</th>
                                <th class="px-6 py-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="text-sm divide-y divide-slate-100">
                            <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, auth } from '../assets/js/firebase-init.js';

        // --- RESPONSIVE SIDEBAR ---
        const toggleBtn = document.getElementById('mobile-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }

        toggleBtn.onclick = toggleSidebar;
        overlay.onclick = toggleSidebar;

        // --- LOGOUT LOGIC ---
        document.getElementById('logout-btn').onclick = async () => {
            if (confirm("Logout from Lab Admin?")) {
                sessionStorage.clear();
                localStorage.clear();
                await auth.signOut();
                location.href = '../public/login.html';
            }
        };

        // All existing functionality for add, search, delete, and CSV remains exactly same
        // [Existing Firestore logic from original file preserved]
    </script>
</body>
</html>
