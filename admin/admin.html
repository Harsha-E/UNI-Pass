<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | UNI-PASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/ui.js" defer></script>
    <script type="module" src="../assets/js/route-guard.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-brand-900 text-white flex flex-col">
            <div class="h-16 flex items-center justify-center border-b border-brand-700">
                <h1 class="text-2xl font-bold tracking-wider">ADMIN</h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="block px-4 py-3 rounded bg-brand-700 text-white font-medium">
                    <i class="fas fa-chart-line w-6"></i> Dashboard
                </a>
                <a href="#" class="block px-4 py-3 rounded hover:bg-brand-700 text-gray-300 transition">
                    <i class="fas fa-users w-6"></i> Manage Users
                </a>
                <a href="#" class="block px-4 py-3 rounded hover:bg-brand-700 text-gray-300 transition">
                    <i class="fas fa-file-alt w-6"></i> All Reports
                </a>
            </nav>
            <div class="p-4 border-t border-brand-700">
                <button id="logout-btn" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded transition">
                    Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800">Overview</h2>
                    <p class="text-gray-500">Welcome back, Administrator.</p>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm font-bold uppercase">Total Students</p>
                    <h3 class="text-3xl font-bold text-gray-800" id="total-students">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm font-bold uppercase">Passes Issued</p>
                    <h3 class="text-3xl font-bold text-gray-800" id="total-passes">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500">
                    <p class="text-gray-500 text-sm font-bold uppercase">Pending Review</p>
                    <h3 class="text-3xl font-bold text-gray-800" id="pending-count">--</h3>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
                    <h3 class="font-bold text-gray-700">Recent System Activity</h3>
                </div>
                <div class="p-6 text-center text-gray-500 italic">
                    (Table data loading...)
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        // --- FIXED IMPORT PATH FOR GITHUB PAGES ---
        import { db, auth } from 'https://harsha-e.github.io/UNI-Pass/assets/js/firebase-init.js';

        // 1. Check Admin Role
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../public/login.html';
            } else {
                // Ideally, check if user.email is an admin email here
                loadStats();
            }
        });

        // 2. Load Dashboard Stats
        async function loadStats() {
            try {
                // Note: Getting 'size' of a collection reads all docs (costs reads).
                // For a real app, use aggregation queries or counters.
                const studentsSnap = await db.collection('users').where('role', '==', 'student').get();
                document.getElementById('total-students').innerText = studentsSnap.size;

                const passesSnap = await db.collection('permissions').where('status', '==', 'APPROVED').get();
                document.getElementById('total-passes').innerText = passesSnap.size;
                
                const pendingSnap = await db.collection('permissions').where('status', 'in', ['PENDING_TEACHER', 'PENDING_HOD']).get();
                document.getElementById('pending-count').innerText = pendingSnap.size;

            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        // 3. Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = '../public/login.html');
        });
    </script>
</body>
</html>
