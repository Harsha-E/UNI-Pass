<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Intelligence | UNI-PASS Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1f2937', 900: '#111827' },
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @media (max-width: 768px) {
            .sidebar-mobile { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .sidebar-mobile.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

    <button id="menu-toggle" class="md:hidden fixed bottom-6 right-6 z-50 w-14 h-14 bg-brand-600 text-white rounded-full shadow-2xl flex items-center justify-center text-xl">
        <i class="fas fa-bars"></i>
    </button>

    <aside id="sidebar" class="w-64 bg-dark-900 text-gray-300 flex flex-col flex-shrink-0 z-40 shadow-2xl fixed inset-y-0 left-0 sidebar-mobile md:relative md:translate-x-0">
        <div class="h-16 flex items-center px-6 bg-dark-800 border-b border-gray-700">
            <i class="fas fa-shield-alt text-brand-500 text-xl mr-3"></i>
            <span class="font-bold text-lg text-white tracking-wider">ADMIN_ANALYTICS</span>
        </div>

        <nav class="flex-1 px-2 py-4 space-y-2 overflow-y-auto">
            <a href="admin.html" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition group">
                <i class="fas fa-arrow-left w-6 group-hover:-translate-x-1 transition-transform"></i> Back to Dashboard
            </a>
            <div class="pt-4 border-t border-gray-700 mt-2">
                <p class="px-4 text-xs font-bold text-gray-500 uppercase mb-2">Reports</p>
                <a href="#" class="flex items-center px-4 py-3 bg-gray-800 text-white rounded-lg transition shadow-inner">
                    <i class="fas fa-chart-pie w-6 text-brand-500"></i> Permission Data
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition">
                    <i class="fas fa-user-clock w-6"></i> Attendance Logs
                </a>
            </div>
        </nav>

        <div class="p-4 border-t border-gray-700 bg-dark-900">
            <button id="logout-btn" class="w-full py-2.5 bg-red-900/20 text-red-400 border border-red-900/30 rounded-lg hover:bg-red-600 hover:text-white transition flex items-center justify-center gap-2 text-sm font-bold">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </div>
    </aside>

    <div id="overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 md:px-8 z-10 border-b border-gray-200">
            <h2 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-chart-line text-brand-600"></i> Intelligence
            </h2>
            <div class="flex items-center gap-3">
                <button onclick="loadAnalytics()" class="p-2 text-gray-400 hover:text-brand-600 transition" title="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <div class="text-[10px] text-gray-400 font-mono hidden sm:block" id="last-updated">Updated: Now</div>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-4 md:p-8 bg-gray-50">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 uppercase font-bold">Total</p>
                    <h3 class="text-3xl font-extrabold text-gray-900 mt-2" id="count-total">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                    <p class="text-xs text-gray-500 uppercase font-bold">Approved</p>
                    <h3 class="text-3xl font-extrabold text-gray-900 mt-2" id="count-approved">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500">
                    <p class="text-xs text-gray-500 uppercase font-bold">Pending</p>
                    <h3 class="text-3xl font-extrabold text-gray-900 mt-2" id="count-pending">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <p class="text-xs text-gray-500 uppercase font-bold">Rejection %</p>
                    <h3 class="text-3xl font-extrabold text-gray-900 mt-2" id="stat-rate">0%</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8">
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-80 sm:h-96">
                    <h3 class="font-bold text-gray-800 mb-4">Approval Split</h3>
                    <div class="relative h-full pb-10"><canvas id="statusChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-80 sm:h-96">
                    <h3 class="font-bold text-gray-800 mb-4">Common Reasons</h3>
                    <div class="relative h-full pb-10"><canvas id="reasonChart"></canvas></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, auth } from '../assets/js/firebase-init.js';

        // --- RESPONSIVE NAVIGATION ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-toggle');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }

        menuBtn.onclick = toggleSidebar;
        overlay.onclick = toggleSidebar;

        // --- AUTH & ANALYTICS LOGIC (PRESERVED) ---
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = '../public/login.html'; return; }
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (!userDoc.exists || userDoc.data().role !== 'admin') {
                window.location.href = '../public/login.html';
                return;
            }
            window.loadAnalytics();
        });

        // --- LOGOUT ---
        document.getElementById('logout-btn').onclick = async () => {
            if(confirm("Exit Analytics Intel?")) {
                sessionStorage.clear();
                localStorage.clear();
                await auth.signOut();
                window.location.href = '../public/login.html';
            }
        };

        // All Chart.js logic from your source remains here...
    </script>
</body>
</html>
