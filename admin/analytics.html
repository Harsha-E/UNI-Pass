<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Uni Pass • Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <script src="/assets/js/route-guard.js"></script>
</head>

<body class="admin-page">

  <nav class="top-nav">
    <span class="brand">Uni Pass</span>
    <div class="nav-links">
      <a href="/admin/admin.html">Admin</a>
      <a class="active">Analytics</a>
    </div>
  </nav>

  <main class="admin-container">

    <section class="admin-card">
      <h2>Permission Metrics</h2>
      <div id="metrics"></div>
    </section>

    <section class="admin-card">
      <h2>Recent Audit Logs</h2>
      <div id="logs"></div>
    </section>

  </main>

  <script type="module">
    import { db } from "/assets/js/firebase-init.js";
    import {
      collection,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const metrics = document.getElementById("metrics");
    const logs = document.getElementById("logs");

    async function loadMetrics() {
      const snap = await getDocs(collection(db, "permissions"));
      metrics.textContent = `Total Permissions: ${snap.size}`;
    }

    async function loadLogs() {
      const q = query(collection(db, "auditLogs"), orderBy("at", "desc"));
      const snap = await getDocs(q);
      logs.innerHTML = "";
      snap.docs.slice(0, 10).forEach(d => {
        const div = document.createElement("div");
        div.className = "queue-item";
        div.textContent = `${d.data().actorRole} • ${d.data().action}`;
        logs.appendChild(div);
      });
    }

    loadMetrics();
    loadLogs();
  </script>

</body>
</html>
